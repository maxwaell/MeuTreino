<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8; --surface:#fff; --surface2:#e5ebf4; --ink:#0e1a2b; --mute:#566680;
  --line:#d3dcea; --accent:#1d6fe0; --ok:#12a37a; --warn:#e8a317; --bad:#e2504a; --water:#2aa7e0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0c1626; --surface:#142238; --surface2:#1b2d49; --ink:#eaf1fb; --mute:#92a6c2;
    --line:#26395a; --accent:#4aa3ff; --ok:#3ddc97; --warn:#f2b53a; --bad:#ff6b63; --water:#4cc3f5; }
}
html{background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px)}
button,select,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .logo svg{width:18px;height:18px}
.brand b{font:700 18px/1 'Barlow Condensed',sans-serif;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.brand .sync{margin-left:auto;border:0;background:none;font-size:12.5px;color:var(--mute);font-weight:600;padding:4px 0;white-space:nowrap}
.sync.ok{color:var(--ok)}.sync.error{color:var(--bad)}.sync.pending,.sync.saving{color:var(--warn)}
h1{margin:0;font:700 52px/.85 'Barlow Condensed',Impact,sans-serif;letter-spacing:-.5px}
h2{margin:26px 0 10px;font:700 24px/1 'Barlow Condensed',sans-serif}
.yr{font:600 20px 'Barlow Condensed',sans-serif;color:var(--mute);margin-left:6px}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sum{font-size:14px;color:var(--mute);text-align:right;line-height:1.25}
.sum b{display:block;font:700 28px/1 'Barlow Condensed',sans-serif;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.lbl{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .v{font:700 34px/1 'Barlow Condensed',sans-serif;margin-top:6px}
.kpi .v small{font-size:16px;color:var(--mute);margin-left:3px}
.kpi .d{font-size:12.5px;color:var(--mute);margin-top:4px}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ring{position:relative;width:86px;height:86px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font:700 19px/1 'Barlow Condensed',sans-serif}
.ring + div{font-size:12.5px;color:var(--mute);margin-top:6px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.list li > span:last-child{font-weight:600;white-space:nowrap}
.alert{padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:14px;margin-top:10px;border-left:3px solid var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.pill:active{background:var(--surface2)}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* calendário */
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{margin:16px 0 6px}
.dow span{text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:66px;padding:6px 2px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.cell.empty{background:transparent;border:1px dashed var(--line)}
.cell .dn{font:700 21px/1 'Barlow Condensed',sans-serif}
.cell .tg{font-size:10px;color:var(--mute);line-height:1.1;white-space:nowrap;overflow:hidden;max-width:100%}
.cell .ic{font-size:11px;line-height:1.1;letter-spacing:-1px}
.cell .bar{margin-top:auto;width:100%;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--c)}
.cell.today{border-color:var(--accent)}
.cell.today .dn{color:var(--accent)}
.cell.sel{background:var(--surface2);border-color:var(--c,var(--accent));box-shadow:inset 0 0 0 1px var(--c,var(--accent))}
.cell.full .dn::after{content:"\2713";font-size:12px;margin-left:2px;color:var(--ok)}
.pad{visibility:hidden}

/* dia */
#detail{margin-top:26px;scroll-margin-top:10px}
.dh{display:flex;align-items:flex-end;gap:14px}
.big{font:700 84px/.78 'Barlow Condensed',sans-serif;color:var(--c);min-width:62px}
.dh .wd{font-size:14px;color:var(--mute)}
.dh .tt{font:700 28px/1 'Barlow Condensed',sans-serif;margin:2px 0}
.dh .fc{font-size:15px;color:var(--mute)}
.stabs{display:flex;gap:8px;overflow-x:auto;margin-top:16px;scrollbar-width:none}
.stab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 13px;text-align:left;min-width:120px}
.stab .sn1{display:block;font-weight:600;font-size:15px;white-space:nowrap}
.stab .sn2{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.stab.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface2)}
.stab.ok .sn2{color:var(--ok);font-weight:600}
.shd{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c)}
.shd .t1{font:700 22px/1.05 'Barlow Condensed',sans-serif}
.shd .t2{font-size:14px;color:var(--mute);margin-top:3px}
.shd .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tagx{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--ink)}
.shd p{margin:10px 0 0;font-size:14px;color:var(--mute)}
.grp{margin:18px 2px 0;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.prog{display:flex;align-items:center;gap:10px;margin-top:16px}
.track{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);transition:width .2s}
.ptxt{font-size:14px;font-weight:600;min-width:52px;text-align:right}
select,.inp{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font-size:16px;padding:0 10px;width:100%}
textarea.inp{height:70px;padding:8px 10px;resize:vertical}
.item{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item.done{border-color:var(--c)}
.ih{display:grid;grid-template-columns:52px 1fr 36px;align-items:center}
.chk{width:34px;height:34px;margin:0 0 0 12px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.item.done .chk{background:var(--c)}
.item.done .chk svg{opacity:1}
.main{background:none;border:0;text-align:left;padding:13px 6px;min-width:0}
.main .nm{display:block;font-size:17px;font-weight:600;line-height:1.2}
.item.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.main .mt{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.main .mt b{color:var(--ink);font-weight:600}
.main .last{display:block;font-size:12.5px;color:var(--accent);margin-top:2px;font-weight:500}
.chev{width:20px;height:20px;justify-self:center;transition:transform .15s;color:var(--mute)}
.item.open .chev{transform:rotate(180deg)}
.sets{padding:2px 12px 14px;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.shead{margin-top:10px;font-size:12px;color:var(--mute);text-align:center;font-weight:600}
.sn{font:700 20px 'Barlow Condensed',sans-serif;color:var(--mute);text-align:center}
.sets input,.cardio input,.num{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);
  text-align:center;font:600 18px 'Barlow',sans-serif;padding:0 6px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.55;font-weight:400}
.sc{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.sc svg{width:20px;height:20px;opacity:0}
.sc.on{background:var(--ok);border-color:var(--ok)}
.sc.on svg{opacity:1}
.sbtns{display:flex;gap:8px;margin-top:12px}
.cardio{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 12px 14px;border-top:1px solid var(--line)}
.cardio .pace{grid-column:1/-1;font-size:13px;color:var(--mute);text-align:center}
.cardio label,.f label{font-size:12px;color:var(--mute);font-weight:600;display:block;margin:10px 0 4px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.rpe button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:600;padding:0}
.rpe button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);border-radius:10px;padding:6px 6px 6px 10px;font-size:14px;font-weight:600;margin:6px 6px 0 0}
.stag button{border:0;background:var(--surface2);width:24px;height:24px;border-radius:50%;padding:0;line-height:1}

/* formulários */
.f{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f .full{grid-column:1/-1}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food .fn{font-weight:600;font-size:15px}
.food .fm{font-size:12.5px;color:var(--mute)}
.x{border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none;padding:0}
.res button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 2px;font-size:15px}
.res button span:last-child{color:var(--mute);font-size:13px}
.macro{display:grid;grid-template-columns:72px 1fr 92px;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.macro .track{height:10px}
.macro span:last-child{text-align:right;font-weight:600}
.meal{margin-top:14px}
.meal .mh{display:flex;justify-content:space-between;font-weight:600;font-size:14px;color:var(--mute)}
.water{display:flex;align-items:center;gap:14px}
.glass{width:46px;height:64px;border:2px solid var(--water);border-top:0;border-radius:0 0 10px 10px;position:relative;overflow:hidden;flex:none}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.85}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.datenav b{font:700 22px 'Barlow Condensed',sans-serif}
.datenav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px}
.ex-ed{display:grid;grid-template-columns:1fr 52px 76px;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ex-ed .inp{height:40px;font-size:15px}
.ex-ed .w2{grid-column:1/2}
.ex-ed .ctr{grid-column:2/4;display:flex;gap:4px;justify-content:flex-end}
.ex-ed .ctr button{width:34px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);padding:0}
.ex-ed .full{grid-column:1/-1}
.plan-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.plan-h .pn{font-weight:600;font-size:17px}
.plan-h .pf{font-size:13px;color:var(--mute)}
.wk{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk > span{font-weight:600;padding-top:8px}
.wk select{height:38px;font-size:14px;margin-top:6px}
.tsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px}
.tsum b{display:block;font:700 30px/1 'Barlow Condensed',sans-serif}
.tsum span{font-size:12.5px;color:var(--mute)}
.cxg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cxb{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 2px;font-size:11.5px;font-weight:600;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px}
.cxb span{font-size:20px;line-height:1}
.cxb.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.mgrid label{font-size:12px;color:var(--mute);font-weight:600;display:block;margin:10px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.mt{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
table.mt th{text-align:right;font-size:12px;color:var(--mute);font-weight:600;padding:4px 6px}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt td{text-align:right;padding:9px 6px;border-top:1px solid var(--line)}
table.mt tr[data-act]{cursor:pointer}
table.mt tr.on td{background:var(--surface2)}
.auth{max-width:420px;margin:3vh auto 0}
.auth .lead{color:var(--mute);margin:10px 0 4px}
.wide{width:100%;height:50px;font-size:16px;margin-top:16px}
.inp.code{letter-spacing:12px;font:700 30px 'Barlow Condensed',sans-serif;text-align:center;height:62px}
.steps{display:flex;gap:6px;margin:16px 0 4px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.steps span.on{background:var(--accent)}
.pwck{list-style:none;padding:0;margin:10px 0 0;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pwck li{color:var(--mute)}.pwck li.ok{color:var(--ok);font-weight:600}
.pwck li::before{content:'○ '}.pwck li.ok::before{content:'✓ '}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 0;font-size:14.5px}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.or{text-align:center;color:var(--mute);font-size:13px;margin:22px 0 4px}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);font-weight:600;white-space:nowrap}
.badge.ativo{color:var(--ok)}.badge.pendente{color:var(--warn)}.badge.bloqueado{color:var(--bad)}
.usr{padding:12px 0;border-top:1px solid var(--line)}
.usr:first-of-type{border-top:0}
a.pill{text-decoration:none;color:inherit;display:inline-block}
a.pill.pri{color:#fff}
.pill[disabled]{opacity:.5}
.foot{margin-top:28px;font-size:12.5px;color:var(--mute);text-align:center}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mute);padding:6px 0}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}
@media (min-width:520px){.tabs{max-width:480px;margin:0 auto;border:1px solid var(--line);border-radius:18px 18px 0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap"><div class="brand" id="brand"></div>
<div id="view"></div></div>
<nav class="tabs" id="tabs"></nav>
<input type="file" id="importFile" accept="application/json" hidden>
<script>
/* =========================================================
   FICHA PADRÃO — MUSCULAÇÃO, CORRIDA E MOBILIDADE
   E(nome, séries, repetições, foco, bloco)
   ========================================================= */
const E = (name, sets, reps, muscle, group) => ({ name, sets, reps, muscle, group: group || '' });
const DEFAULT_PLANS = [
  { id:'fbA', type:'gym', name:'Full Body A', tag:'FB A', color:'#3b8cf0', focus:'Pernas + peitoral + dorsais',
    rest:'Principais 90–120 s · isoladores 45–75 s', intensity:'1–3 repetições em reserva (RIR)', min:60,
    note:'Depois da musculação vem a corrida de 10 km em ritmo controlado.', ex:[
    E('Agachamento no Smith',3,'8-10','Quadríceps + glúteos'), E('Hip Thrust',3,'10-12','Glúteos'),
    E('Panturrilha sentado',3,'10-15','Sóleo'), E('Supino inclinado no Smith',3,'8-10','Peitoral superior'),
    E('Puxada alta supinada',3,'8-10','Dorsais + bíceps'), E('Remada baixa no cabo',2,'10-12','Costas'),
    E('Elevação lateral no cabo',2,'12-15','Deltoide lateral'), E('Crucifixo inverso máquina',2,'12-15','Deltoide posterior'),
    E('Rosca Scott',2,'10-12','Bíceps'), E('Tríceps no cabo',2,'10-12','Tríceps'), E('Abdominal máquina',2,'12-15','Reto abdominal')]},
  { id:'fbB', type:'gym', name:'Full Body B', tag:'FB B', color:'#f2694a', focus:'Volume, técnica e hipertrofia',
    rest:'Principais 90–120 s · isoladores 45–75 s', intensity:'1–3 repetições em reserva (RIR)', min:65,
    note:'Termine a maioria das séries com aproximadamente 1–3 repetições em reserva.', ex:[
    E('Leg Press 45°',3,'10-12','Quadríceps + glúteos'), E('Mesa flexora',3,'10-12','Posterior de coxa'),
    E('Panturrilha em pé',3,'10-15','Gastrocnêmio'), E('Supino reto máquina',3,'8-10','Peitoral + tríceps'),
    E('Remada cavalinho/T-bar',3,'8-10','Costas + bíceps'), E('Puxada alta pronada',2,'10-12','Dorsais'),
    E('Desenvolvimento máquina',2,'10-12','Deltoide anterior'), E('Elevação lateral no cabo',2,'12-15','Deltoide lateral'),
    E('Crucifixo inverso máquina',2,'12-15','Deltoide posterior'), E('Rosca no cabo',2,'10-12','Bíceps'),
    E('Tríceps corda',2,'10-12','Tríceps'), E('Abdominal máquina',2,'12-15','Reto abdominal')]},

function normalize(o){
  const s = Object.assign(defaultState(), o || {});
  if (!s.extra) s.extra = {}; if (!s.measures) s.measures = [];
  s.plans.forEach(p => {
    if (p.type === 'run'){ p.name = p.name.replace(/\s*[—-]\s*(fácil|qualidade|completo)\s*$/i, ''); if (p.tag === '10 km Q') p.tag = '10 km'; }
    const d = DEFAULT_PLANS.find(x => x.id === p.id);
    if (d && /^Depois (vem o Pilates|da Mobilidade B)/.test(p.note || '')) p.note = d.note;
  });
  const fixWed = a => Array.isArray(a) && a.join() === 'mobB,pil' ? ['pil','mobB'] : a;   // quarta: Pilates primeiro
  s.week = s.week.map(fixWed);
  for (const k in s.schedule) s.schedule[k] = fixWed(s.schedule[k]);
  s.weights.forEach(w => {                    // cintura/% gordura antigos viram medidas
    if (w.waist || w.bf){ let m = s.measures.find(x => x.d === w.d); if (!m) s.measures.push(m = { d:w.d, m:{} });
      if (w.waist && !m.m.cintura) m.m.cintura = w.waist; if (w.bf && !m.m.bf) m.m.bf = w.bf; }
    delete w.waist; delete w.bf; });
  return s;
}

function loadLocal(scope){
  try {
    const raw = localStorage.getItem(KEY + ':' + scope);
    if (raw) return normalize(JSON.parse(raw));
    if (!localStorage.getItem(KEY + ':migrado')){
      for (const k of [KEY + ':local', KEY, ...PREV_KEYS]){
        if (k === KEY + ':' + scope) continue;
        const old = localStorage.getItem(k); if (!old) continue;
        localStorage.setItem(KEY + ':migrado', scope);
        const p = JSON.parse(old);
        if (k.startsWith(KEY)) return normalize(p);
        const s = defaultState();
        ['logs','day','water','food','weights','customFoods','profile'].forEach(f => { if (p[f]) s[f] = p[f]; });
        return normalize(s);
      }
    }
  } catch(e){ storageOK = false; }
  return defaultState();
}

function entry(k,it){
  const L = S.logs[k] || (S.logs[k] = {});

    if (it.kind === 'cardio'){ e.cardio = true; e.tk = it.km; } L[it.id] = e; }
  return e;
}
function statsOf(k, list){
  if (!list.length) return null;
  const done = list.filter(it => { const e = peek(k,it.id); return e && e.done; }).length;
  return { done, total:list.length };
}

function lastFor(name, k){
  const keys = Object.keys(S.logs).filter(x => x < k).sort().reverse();
  for (const x of keys) for (const id in S.logs[x]){
    const e = S.logs[x][id];
    if (e.n === name && e.sets){
      const w = e.sets.filter(s => s.k !== '');
      if (w.length){ const s = w[w.length-1]; return (s.r ? s.r+' × ' : '')+s.k+' kg'; }
    }
  }
  return null;
}
const kmFromText = t => { const m = String(t).match(/(\d+[.,]?\d*)\s*km/i); return m ? num(m[1]) : 0; };

/* métricas do dia a partir dos registros */
function dayMetrics(k){
  const L = S.logs[k] || {}; let vol = 0, sets = 0, km = 0, cmin = 0, mob = 0;
  for (const id in L){
    const e = L[id];
    if (e.sets) e.sets.forEach(s => {
      if (!(s.d || e.done)) return;
      sets++;
      const r = num(s.r) || num(String(e.rp||'').split('-')[0]) || 10;
      vol += r * num(s.k);
    });
    if (e.cardio || id === 'c'){
      km += num(e.km) || (e.done ? (num(e.tk) || kmFromText(e.n)) : 0);
      cmin += num(e.min);
    }
  }
  (S.extra[k] || []).forEach(x => { const c = cardioById(x.t); if (c[4]) km += num(x.km); cmin += num(x.min); });
  sessions(k).forEach(p => { if (p.type === 'mob'){ const s = statsOf(k, sessionItems(p)); if (s && s.done) mob++; } });
  return { vol, sets, km, cmin, mob };
}

function exerciseKcal(k){
  const w = curWeight(), D = S.day[k] || {}; let kcal = 0;
  sessions(k).forEach(p => {
    if (p.type === 'run') return;
    const s = statsOf(k, sessionItems(p)); if (!s || !s.done) return;
    const min = (p.type === 'gym' && num(D.min)) ? num(D.min) : num(p.min) || 45;
    kcal += MET[p.type] * w * min / 60 * (s.done / s.total);
  });
  kcal += dayMetrics(k).km * w;                       // corridas: ~1 kcal/kg/km
  (S.extra[k] || []).forEach(x => { const c = cardioById(x.t); if (c[4] && num(x.km)) return; kcal += c[3] * w * num(x.min) / 60; });
  return Math.round(kcal);
}

function curWeight(){
  const w = [...S.weights].sort((a,b) => a.d < b.d ? -1 : 1);
  return w.length ? w[w.length-1].kg : num(S.profile.weight) || 70;
}
const measList = () => [...(S.measures || [])].sort((a,b) => a.d < b.d ? -1 : 1);
function measEvolution(){
  const ms = measList();
  return MEAS_ALL.map(([key,name,,down]) => {
    const pts = ms.filter(x => num(x.m[key])).map(x => ({ d:x.d, v:num(x.m[key]) }));
    if (!pts.length) return null;
    const first = pts[0].v, last = pts[pts.length-1].v;
    return { key, name: key==='bf' ? name : name+' (cm)', pts, first, last, diff:last-first, n:pts.length, goodDown:down, firstD:pts[0].d, lastD:pts[pts.length-1].d };
  }).filter(Boolean);
}
function bmr(){ const p = S.profile; return 10*curWeight() + 6.25*num(p.height) - 5*num(p.age) + (p.sex==='f' ? -161 : 5); }
const GOALS = { cut:{n:'Perder gordura',adj:-500}, keep:{n:'Manter',adj:0}, gain:{n:'Ganhar massa',adj:300} };
function energy(k){
  const base = Math.round(bmr() * num(S.profile.activity || 1.2)), ex = exerciseKcal(k);
  return { base, ex, out: base + ex, target: base + ex + GOALS[S.profile.goal||'cut'].adj };
}
const allFoods = () => [...S.customFoods.map(f => [f.name,f.kcal,f.p,f.c,f.f,f.g||100,true]), ...FOODS];
function foodTotals(k){
  const t = { kcal:0, p:0, c:0, f:0 };
  (S.food[k] || []).forEach(x => { t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.f += x.f; });
  return t;
}
const proteinTarget = () => Math.round(num(S.profile.protein || 1.8) * curWeight());
const waterGoal = () => Math.round(num(S.profile.water || 35) * curWeight() / 50) * 50;

/* ---------- gráficos ---------- */
function ring(val, max, color, label, sub){
  const r = 36, c = 2*Math.PI*r, pct = max ? clamp(val/max,0,1) : 0;
  return '<div><div class="ring"><svg width="86" height="86" viewBox="0 0 86 86">'
    + '<circle cx="43" cy="43" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="9"/>'
    + '<circle cx="43" cy="43" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(c*pct)+' '+c+'"/>'
    + '</svg><div class="rv">'+label+'</div></div><div>'+sub+'</div></div>';
}
function barChart(rows, key1, key2, c1, c2){
  const W = 320, H = 130, n = rows.length, bw = (W - 20) / n;
  const m1 = Math.max(1, ...rows.map(r => r[key1])), m2 = Math.max(1, ...rows.map(r => r[key2]));
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+(H+18)+'">';
  rows.forEach((r,i) => {
    const x = 10 + i*bw, h1 = (r[key1]/m1)*(H-16), h2 = (r[key2]/m2)*(H-16);
    s += '<rect x="'+(x+bw*.14)+'" y="'+(H-h1)+'" width="'+(bw*.34)+'" height="'+h1+'" rx="3" fill="'+c1+'"/>';
    s += '<rect x="'+(x+bw*.52)+'" y="'+(H-h2)+'" width="'+(bw*.34)+'" height="'+h2+'" rx="3" fill="'+c2+'"/>';
    s += '<text x="'+(x+bw/2)+'" y="'+(H+14)+'" font-size="10" text-anchor="middle" fill="var(--mute)">'+r.label+'</text>';
  });
  return s + '</svg>';
}
function lineChart(pts, color){
  if (pts.length < 2) return '<p class="sub">Registre ao menos duas pesagens para ver a curva.</p>';
  const W = 320, H = 110, ys = pts.map(p => p.y), mn = Math.min(...ys) - .5, mx = Math.max(...ys) + .5;
  const X = i => 14 + i*(W-28)/(pts.length-1), Y = v => 8 + (mx - v)/(mx - mn)*(H-16);
  const d = pts.map((p,i) => (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+(H+16)+'"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach((p,i) => { s += '<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="3.5" fill="'+color+'"/>';
    if (i===0 || i===pts.length-1 || pts.length<=6) s += '<text x="'+X(i)+'" y="'+(H+13)+'" font-size="10" text-anchor="middle" fill="var(--mute)">'+p.label+'</text>'; });
  return s + '</svg>';
}

function eachDay(fn){ MONTHS.forEach(M => { for (let d=1; d<=daysIn(M.y,M.m); d++) fn(kOf(M.y,M.m,d)); }); }
function renderDash(){
  let planned = 0, full = 0;
  eachDay(k => { if (k > TODAY) return; const s = stats(k); if (!s) return; planned++; if (s.done === s.total) full++; });
  const constancy = planned ? Math.round(100*full/planned) : 0;
  let streak = 0, k = TODAY;
  const st0 = stats(k); if (st0 && st0.done < st0.total) k = addDays(k,-1);
  while (k >= ORIGIN){ const s = stats(k); if (s){ if (s.done === s.total) streak++; else break; } k = addDays(k,-1); }

  const ws = weekStart(TODAY), weeks = [];
  for (let i=7; i>=0; i--){
    const start = addDays(ws, -7*i); if (addDays(start,6) < ORIGIN) continue;
    const w = { start, label:fmtD(start), vol:0, km:0, sets:0, mob:0, gym:0, rpe:[] };
    for (let j=0; j<7; j++){ const d = addDays(start,j), m = dayMetrics(d);
      w.vol += m.vol; w.km += m.km; w.sets += m.sets; w.mob += m.mob; if (m.sets) w.gym++;
      const r = (S.day[d]||{}).rpe; if (r) w.rpe.push(r); }
    weeks.push(w);
  }
  const cur = weeks[weeks.length-1] || { vol:0, km:0, sets:0, mob:0, gym:0, rpe:[] }, prev = weeks[weeks.length-2];
  const tgt = weekTargets();
  let kmTotal = 0; eachDay(d => { kmTotal += dayMetrics(d).km; });
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0, rpeCur = avg(cur.rpe);
  const delta = (a,b) => !b ? '' : (a>=b ? '<span class="up">▲ ' : '<span class="down">▼ ')+fmt(Math.abs(100*(a-b)/(b||1)))+'% vs semana anterior</span>';

  const e = energy(TODAY), ft = foodTotals(TODAY), water = S.water[TODAY] || 0, pT = proteinTarget(), wg = waterGoal(), bal = ft.kcal - e.out;
  const ws2 = [...S.weights].sort((a,b) => a.d < b.d ? -1 : 1), lastW = ws2[ws2.length-1], firstW = ws2[0];
  const daysSinceW = lastW ? Math.round((parseK(TODAY) - parseK(lastW.d))/864e5) : null;
  const pr = {};
  for (const d in S.logs) for (const id in S.logs[d]){ const x = S.logs[d][id];
    (x.sets||[]).forEach(s => { const kg = num(s.k); if (kg && (!pr[x.n] || kg > pr[x.n].kg)) pr[x.n] = { kg, d }; }); }
  const prs = Object.entries(pr).sort((a,b) => b[1].kg - a[1].kg).slice(0,5);

  const ts = sessions(TODAY), tst = stats(TODAY);
  const nm = displayName();
  let h = '<div class="top"><div><h1>'+(nm ? 'Olá, '+esc(nm.split(' ')[0]) : 'Resumo')+'</h1><div class="sub">'+longD(TODAY)+'</div></div>'
    + '<div class="sum"><b>'+streak+'</b>'+(streak===1?'dia seguido':'dias seguidos')+'</div></div>';
  if (ts.length) h += '<div class="card" style="border-left:4px solid '+ts[0].color+'"><div class="lbl">Hoje</div>'
    + ts.map(p => { const s = statsOf(TODAY, sessionItems(p));
        return '<div style="display:flex;justify-content:space-between;gap:10px;margin-top:6px"><span style="font:700 22px/1.1 \'Barlow Condensed\'">'+icon(p)+' '+esc(p.name)+'</span><span class="sub" style="margin:0">'+s.done+'/'+s.total+'</span></div>'; }).join('')
    + '<div class="row" style="margin-top:12px;justify-content:space-between"><span class="sub" style="margin:0">'+tst.done+' de '+tst.total+' itens feitos</span><button class="pill pri" data-act="goToday">Abrir treino</button></div></div>';
  else h += '<div class="card"><div class="lbl">Hoje</div><div class="sub">Nenhuma sessão programada. Dia livre!</div><div class="row" style="margin-top:10px"><button class="pill" data-act="goToday">⚡ Registrar cardio</button></div></div>';
  const xt = S.extra[TODAY] || [];
  if (xt.length) h += '<div class="card"><div class="lbl">⚡ Cardio avulso hoje</div><div class="sub">'+xt.map(x => { const c = cardioById(x.t); return c[2]+' '+(x.t==='outro'&&x.n?esc(x.n):c[1])+(num(x.km)?' '+fmt(num(x.km),1)+' km':'')+(num(x.min)?' · '+fmt(num(x.min))+' min':''); }).join('<br>')+'</div></div>';

  if (daysSinceW === null || daysSinceW >= 7)
    h += '<div class="alert">⚖️ '+(daysSinceW===null ? 'Registre seu peso para calibrar as metas.' : 'Já faz '+daysSinceW+' dias desde a última pesagem.')
      + ' <button class="pill" data-act="tab" data-t="peso" style="margin-left:6px">Pesar</button></div>';

  h += '<h2>Nutrição de hoje</h2><div class="card"><div class="rings">'
    + ring(water, wg, 'var(--water)', fmt(water/1000,1)+'L', 'Água · meta '+fmt(wg/1000,1)+'L')
    + ring(ft.p, pT, 'var(--ok)', fmt(ft.p)+'g', 'Proteína · meta '+pT+'g')
    + ring(ft.kcal, e.target, 'var(--warn)', fmt(ft.kcal), 'kcal · meta '+fmt(e.target))
    + '</div><div class="row" style="margin-top:14px;justify-content:space-between">'
    + '<span class="sub" style="margin:0">'+(ft.kcal ? (bal<0 ? 'Déficit de <b class="up">'+fmt(-bal)+' kcal</b>' : 'Superávit de <b class="down">'+fmt(bal)+' kcal</b>') : 'Sem refeições registradas')+'</span>'
    + '<div class="row"><button class="pill" data-act="water" data-ml="250">+250 ml</button><button class="pill" data-act="tab" data-t="food">+ Comida</button></div></div></div>';

  h += '<h2>Esta semana</h2><div class="card"><div class="tsum">'
    + '<div><b>'+cur.gym+'<small style="font-size:16px;color:var(--mute)">/'+tgt.gym+'</small></b><span>🏋️ musculação</span></div>'
    + '<div><b>'+fmt(cur.km,1)+'<small style="font-size:16px;color:var(--mute)">/'+fmt(tgt.km)+'</small></b><span>🏃 km</span></div>'
    + '<div><b>'+cur.mob+'<small style="font-size:16px;color:var(--mute)">/'+tgt.mob+'</small></b><span>🧘 mobilidade</span></div></div></div>';
  h += '<div class="kpis" style="margin-top:10px">'
    + '<div class="kpi"><div class="lbl">Constância</div><div class="v">'+constancy+'<small>%</small></div><div class="d">'+full+' de '+planned+' dias completos até hoje</div></div>'
    + '<div class="kpi"><div class="lbl">Km corridos</div><div class="v">'+fmt(kmTotal,1)+'<small>km</small></div><div class="d">Total registrado no app</div></div>'
    + '<div class="kpi"><div class="lbl">Volume semanal</div><div class="v">'+fmt(cur.vol/1000,1)+'<small>t</small></div><div class="d">'+(delta(cur.vol, prev && prev.vol) || cur.sets+' séries feitas')+'</div></div>'
    + '<div class="kpi"><div class="lbl">Intensidade</div><div class="v">'+(rpeCur?fmt(rpeCur,1):'–')+'<small>/10</small></div><div class="d">Esforço percebido médio</div></div></div>';
  if (weeks.length) h += '<div class="card"><div class="lbl">Evolução semanal (semana começa na quinta)</div>'
    + barChart(weeks, 'vol', 'km', 'var(--accent)', 'var(--ok)')
    + '<div class="legend"><span><i style="background:var(--accent)"></i>Volume (kg levantados)</span><span><i style="background:var(--ok)"></i>Km corridos</span></div></div>';
  h += '<div class="card"><div class="lbl">Recordes de carga</div>'
    + (prs.length ? '<ul class="list">'+prs.map(([n,v]) => '<li><span>'+esc(n)+'</span><span>'+fmt(v.kg,1)+' kg</span></li>').join('')+'</ul>'
                  : '<p class="sub">Registre cargas nas séries para ver seus recordes.</p>') + '</div>';

  h += '<h2>Corpo</h2><div class="kpis">'
    + '<div class="kpi"><div class="lbl">Peso atual</div><div class="v">'+fmt(curWeight(),1)+'<small>kg</small></div><div class="d">'
    + (firstW && lastW && firstW !== lastW ? ((lastW.kg-firstW.kg)<=0?'<span class="up">':'<span class="down">')+(lastW.kg-firstW.kg>0?'+':'')+fmt(lastW.kg-firstW.kg,1)+' kg desde '+fmtD(firstW.d)+'</span>' : 'Do perfil')+'</div></div>'
    + (() => { const c = measEvolution().find(x => x.key==='cintura'); return c ? '<div class="kpi"><div class="lbl">Cintura</div><div class="v">'+fmt(c.last,1)+'<small>cm</small></div><div class="d">'+(c.n>1?'<span class="'+(c.diff<=0?'up':'down')+'">'+(c.diff>0?'+':'')+fmt(c.diff,1)+' cm desde '+fmtD(c.firstD)+'</span>':'Primeira medida')+'</div></div>' : ''; })()
    + '<div class="kpi"><div class="lbl">IMC</div><div class="v">'+fmt(curWeight()/Math.pow(num(S.profile.height)/100||1.7,2),1)+'</div><div class="d">Altura '+esc(S.profile.height)+' cm</div></div></div>';
  if (ws2.length > 1) h += '<div class="card"><div class="lbl">Peso (kg)</div>'+lineChart(ws2.slice(-10).map(w => ({ y:w.kg, label:fmtD(w.d) })), 'var(--accent)')+'</div>';
  h += '<div class="row" style="margin-top:22px;justify-content:center"><button class="pill pri" data-act="excel">📊 Exportar para Excel</button></div>';
  h += '<p class="foot">'+(!storageOK ? 'Este navegador não permite salvar: os registros somem ao fechar a página.'
      : ACC && ACC.mode === 'cloud' ? 'Seus dados ficam salvos no aparelho e no Google Drive.' : 'Modo sem conta: os registros ficam só neste aparelho.')+'</p>';
  return h;
}
function weekTargets(){
  const t = { gym:0, km:0, mob:0 };
  S.week.forEach(d => d.forEach(id => { const p = planById(id); if (!p) return;
    if (p.type==='gym') t.gym++; else if (p.type==='run') t.km += num(p.km); else if (p.type==='mob') t.mob++; }));
  return t;
}

function renderTrain(){
  const M = MONTHS[UI.month], n = daysIn(M.y,M.m);
  let full = 0, planned = 0;
  for (let d=1; d<=n; d++){ const s = stats(kOf(M.y,M.m,d)); if (s){ planned++; if (s.done===s.total) full++; } }
  let h = '<div class="top"><h1>'+M.n+'<span class="yr">'+M.y+'</span></h1><div class="sum"><b>'+full+' de '+planned+'</b>dias concluídos</div></div>';
  h += '<div class="chips">'+MONTHS.map((x,i) => '<button class="chip'+(i===UI.month?' on':'')+'" data-act="month" data-i="'+i+'">'+x.n+'</button>').join('')+'</div>';
  if (!planned) h += '<div class="card"><b>Mês sem treinos cadastrados.</b><div class="sub">Aplique a ficha semanal (quinta a quarta) ou toque em um dia para montar as sessões.</div>'
    + '<div class="row" style="margin-top:10px"><button class="pill pri" data-act="applyWeek">Aplicar ficha semanal</button></div></div>';
  h += '<div class="dow">'+WEEK_S.map(d => '<span>'+d+'</span>').join('')+'</div><div class="grid">';
  const off = wkIdx(kOf(M.y,M.m,1));
  for (let i=0; i<off; i++) h += '<span class="pad"></span>';
  for (let d=1; d<=n; d++){
    const k = kOf(M.y,M.m,d), ss = sessions(k), s = stats(k);
    const cls = (k===UI.sel?' sel':'')+(k===TODAY?' today':'');
    const xs = S.extra[k] || [], xi = xs.length ? '⚡' : '';
    if (!ss.length){ h += '<button class="cell empty'+cls+'" data-act="sel" data-k="'+k+'" aria-label="Dia '+d+', livre'+(xs.length?', com cardio avulso':'')+'"'+(xs.length?' style="border-style:solid"':'')+'><span class="dn">'+d+'</span><span class="tg">'+(xs.length?'cardio':'livre')+'</span><span class="ic">'+xi+'</span></button>'; continue; }
    const main = ss.find(p => p.type==='gym') || ss[0];
    h += '<button class="cell'+cls+(s.done===s.total?' full':'')+'" data-act="sel" data-k="'+k+'" style="--c:'+main.color+'" aria-label="Dia '+d+', '+esc(ss.map(p=>p.name).join(' e '))+', '+s.done+' de '+s.total+' feitos">'
      + '<span class="dn">'+d+'</span><span class="tg">'+esc(main.tag)+'</span><span class="ic">'+ss.map(icon).join('')+xi+'</span>'
      + '<span class="bar"><i style="width:'+Math.round(100*s.done/s.total)+'%"></i></span></button>';
  }
  h += '</div><section id="detail" aria-live="polite">'+renderDetail()+'</section>';
  if (planned) h += '<div class="row" style="margin-top:22px;justify-content:center"><button class="pill" data-act="applyWeek">Reaplicar ficha semanal</button><button class="pill danger" data-act="clearMonth">Limpar mês</button></div>';
  return h;
}

  else meta = '<b>'+(it.psets ? it.psets+'×' : '')+esc(it.reps)+'</b>'+(it.muscle ? ' · '+esc(it.muscle) : '');

    + '<span class="nm">'+esc(it.kind==='cardio' ? 'Registrar corrida' : it.name)+'</span><span class="mt">'+meta+'</span>'
    + (last ? '<span class="last">Última vez: '+esc(last)+'</span>' : '') + '</button>'

        + '<input inputmode="numeric" aria-label="Repetições da série '+(i+1)+'" data-f="r" data-id="'+it.id+'" data-i="'+i+'" value="'+esc(s.r)+'" placeholder="'+esc(it.reps)+'">'
        + '<input inputmode="decimal" aria-label="Carga da série '+(i+1)+'" data-f="k" data-id="'+it.id+'" data-i="'+i+'" value="'+esc(s.k)+'" placeholder="kg">'
        + '<button class="sc'+(s.d?' on':'')+'" data-act="sdone" data-id="'+it.id+'" data-i="'+i+'" aria-label="Série '+(i+1)+' feita" aria-pressed="'+!!s.d+'">'+CHECK+'</button></div>';
    });
    h += '<div class="sbtns"><button class="pill" data-act="addset" data-id="'+it.id+'">+ Série</button>'
      + ((e.sets||[]).length > 1 ? '<button class="pill" data-act="delset" data-id="'+it.id+'">− Série</button>' : '') + '</div></div>';

function cardioBlock(k){
  const xs = S.extra[k] || [];
  let h = '<div class="card"><div class="lbl">⚡ Cardio avulso</div><div class="sub" style="margin-top:2px">Fez um cardio fora da ficha? Toque na modalidade e registre.</div>';
  if (xs.length) h += '<ul class="list" style="margin-top:6px">'+xs.map(x => { const c = cardioById(x.t), km = num(x.km), mn = num(x.min);
      const pace = c[4] && km && mn ? ' · pace '+Math.floor(mn/km)+':'+pad(Math.round(((mn/km)%1)*60))+' min/km' : '';
      return '<li><span>'+c[2]+' <b>'+esc(x.t==='outro' && x.n ? x.n : c[1])+'</b><br><span class="sub" style="margin:0">'+(km?fmt(km,1)+' km · ':'')+(mn?fmt(mn)+' min':'')+pace+'</span></span>'
        + '<button class="x" data-act="cxDel" data-id="'+x.id+'" aria-label="Remover">×</button></li>'; }).join('')+'</ul>';
  h += '<div class="cxg">'+CARDIO.map(c => '<button class="cxb'+(UI.cx===c[0]?' on':'')+'" data-act="cxPick" data-t="'+c[0]+'"><span>'+c[2]+'</span>'+c[1]+'</button>').join('')+'</div>';
  if (UI.cx){
    const c = cardioById(UI.cx);
    const last = Object.keys(S.extra).sort().reverse().flatMap(d => S.extra[d]).find(x => x.t === c[0]);
    const dk = last ? last.km : (c[5] || ''), dm = last ? last.min : c[6];
    h += '<div class="f" style="margin-top:6px">'
      + (c[0]==='outro' ? '<div class="full"><label>Qual?</label><input class="inp" id="cxN" placeholder="Ex.: Futebol, dança, spinning"></div>' : '')
      + '<div><label>Distância (km)</label><input class="num" id="cxK" inputmode="decimal" value="'+esc(dk||'')+'" placeholder="opcional"></div>'
      + '<div><label>Tempo (min)</label><input class="num" id="cxM" inputmode="numeric" value="'+esc(dm||'')+'"></div></div>'
      + '<div class="row" style="margin-top:10px"><button class="pill pri" data-act="cxAdd">Adicionar '+c[2]+' '+esc(c[1])+'</button><button class="pill" data-act="cxPick" data-t="">Cancelar</button></div>';
  }
  return h + '</div>';
}
function renderDetail(){

    + '<div class="tt">Dia livre</div><div class="fc">Registre um cardio ou adicione uma sessão</div></div></div>' + cardioBlock(k) + manage;

    + '<div class="prog" style="--c:'+ss[0].color+'"><div class="track"><i style="width:'+Math.round(100*all.done/all.total)+'%"></i></div><span class="ptxt">'+all.done+' de '+all.total+'</span></div>';

  if (ss.length > 1) h += '<div class="stabs" role="tablist">'+ss.map(p => { const s = statsOf(k, sessionItems(p));
      return '<button class="stab'+(p.id===cur.id?' on':'')+(s.done===s.total?' ok':'')+'" role="tab" aria-selected="'+(p.id===cur.id)+'" data-act="sess" data-p="'+p.id+'" style="--c:'+p.color+'">'
        + '<span class="sn1">'+icon(p)+' '+esc(p.name)+'</span><span class="sn2">'+TYPES[p.type].n+' · '+(s.done===s.total?'✓ concluída':s.done+'/'+s.total)+'</span></button>'; }).join('')+'</div>';

  h += '<div style="--c:'+cur.color+'"><div class="shd"><div class="lbl">'+icon(cur)+' '+TYPES[cur.type].n+'</div><div class="t1">'+esc(cur.name)+'</div><div class="t2">'+esc(cur.focus)+'</div>'
    + '<div class="meta">'+(cur.type!=='run' && cur.type!=='simple' ? '<span class="tagx">'+cur.ex.length+' exercícios</span>' : '')
    + (cur.min ? '<span class="tagx">~'+cur.min+' min</span>' : '')+(cur.km ? '<span class="tagx">'+fmt(cur.km)+' km</span>' : '')
    + (cur.rest ? '<span class="tagx">⏱ '+esc(cur.rest)+'</span>' : '')+(cur.intensity ? '<span class="tagx">🎯 '+esc(cur.intensity)+'</span>' : '')+'</div>'
    + (cur.note ? '<p>'+esc(cur.note)+'</p>' : '')+'</div>'
    + '<div class="prog"><div class="track"><i style="width:'+Math.round(100*cs.done/cs.total)+'%"></i></div><span class="ptxt">'+cs.done+' de '+cs.total+'</span>'
    + '<button class="pill" data-act="allSess">'+(cs.done===cs.total?'Desmarcar':'Marcar todos')+'</button></div>';
  let g = null;
  curItems.forEach(it => { if (it.group && it.group !== g){ g = it.group; h += '<div class="grp">'+esc(g)+'</div>'; } h += itemHTML(it, k); });
  h += '</div>';

  h += '<div class="card"><div class="lbl">Como foi o dia</div><div class="f">'
    + (ss.some(p => p.type==='gym') ? '<div><label>Duração da musculação (min)</label><input class="num" inputmode="numeric" data-day="min" value="'+esc(D.min)+'" placeholder="'+(ss.find(p=>p.type==='gym').min||60)+'"></div>' : '<div></div>')
    + '<div><label>Gasto estimado</label><div class="num" style="display:grid;place-items:center;background:none;border-style:dashed">'+fmt(exerciseKcal(k))+' kcal</div></div></div>'
    + '<label class="lbl" style="display:block;margin-top:12px">Esforço percebido (1 = leve · 10 = máximo)</label>'
    + '<div class="rpe">'+Array.from({length:10},(_,i) => '<button data-act="rpe" data-v="'+(i+1)+'" class="'+(D.rpe===i+1?'on':'')+'">'+(i+1)+'</button>').join('')+'</div>'
    + '<label class="lbl" style="display:block;margin-top:12px">Anotações</label><textarea class="inp" data-day="note" placeholder="Dor, sono, energia, ajustes de carga...">'+esc(D.note)+'</textarea></div>';
  return h + cardioBlock(k) + manage;
}

function foodResults(){
  const q = UI.q.trim().toLowerCase(); if (!q) return '';
  const list = allFoods().filter(f => f[0].toLowerCase().includes(q)).slice(0,8);
  if (!list.length) return '<p class="sub">Nada encontrado. Cadastre o alimento abaixo.</p>';
  return list.map(f => '<button data-act="pick" data-n="'+esc(f[0])+'"><span>'+esc(f[0])+(f[6]?' ★':'')+'</span><span>'+f[1]+' kcal · '+f[2]+' g prot /100 g</span></button>').join('');
}
const preview = (f,g) => fmt(f[1]*g/100)+' kcal · P '+fmt(f[2]*g/100,1)+' g · C '+fmt(f[3]*g/100,1)+' g · G '+fmt(f[4]*g/100,1)+' g';
function pickPreview(){
  if (!UI.pick) return '';

  return '<div class="card" style="margin-top:8px;background:var(--surface2)"><b>'+esc(f[0])+'</b><div class="f">'
    + '<div><label>Quantidade (g ou ml)</label><input class="num" inputmode="decimal" data-food="g" value="'+esc(UI.g)+'"></div>'
    + '<div><label>Refeição</label><select data-ch="meal">'+MEALS.map((m,i) => '<option value="'+i+'"'+(i===UI.meal?' selected':'')+'>'+m+'</option>').join('')+'</select></div></div>'

}

    + (t.kcal && t.p < pT ? '<div class="alert" style="border-color:var(--ok)">Faltam <b>'+fmt(pT-t.p)+' g de proteína</b> para a meta ('+S.profile.protein+' g/kg).</div>' : '')

function renderWeight(){
  const ws = [...S.weights].sort((a,b) => a.d < b.d ? -1 : 1), last = ws[ws.length-1];
  const since = last ? Math.round((parseK(TODAY) - parseK(last.d))/864e5) : null, goalW = num(S.profile.goalWeight);
  const ms = measList(), lastM = ms[ms.length-1], prevVal = key => { for (let i=ms.length-1; i>=0; i--) if (num(ms[i].m[key])) return num(ms[i].m[key]); return 0; };
  let h = '<h1>Corpo</h1><div class="sub">Peso ao menos 1× por semana (de preferência na quinta, em jejum). Medidas a cada 2–4 semanas, sempre no mesmo horário.</div>';
  h += '<div class="card"><div class="f"><div><label>Data</label><input class="inp" type="date" id="wD" value="'+TODAY+'"></div>'
    + '<div><label>Peso (kg)</label><input class="num" id="wK" inputmode="decimal" placeholder="'+fmt(curWeight(),1)+'"></div></div>'
    + '<button class="plan-h" data-act="toggleMeas" style="margin-top:14px"><span class="pn" style="flex:1">📏 Medidas (cm) e % de gordura <span class="pf">· opcional</span></span>'+CHEV+'</button>';
  if (UI.meas){
    h += '<div class="mgrid">'+MEASURES.map(([k,n,hint]) => { const p = prevVal(k);
      return '<div><label for="m_'+k+'">'+n+'</label><input class="num" id="m_'+k+'" inputmode="decimal" placeholder="'+(p?fmt(p,1):'cm')+'" title="'+esc(hint)+'"></div>'; }).join('')
      + '<div><label for="m_bf">% gordura</label><input class="num" id="m_bf" inputmode="decimal" placeholder="'+(prevVal('bf')?fmt(prevVal('bf'),1):'%')+'"></div></div>'
      + '<div class="sub">Os números em cinza são a última medida. Meça com fita, sem apertar, sempre do mesmo lado/ponto.</div>';
  }
  h += '<div class="row" style="margin-top:12px"><button class="pill pri" data-act="addWeight">Registrar</button></div></div>';
  h += '<div class="kpis" style="margin-top:10px">'
    + '<div class="kpi"><div class="lbl">Peso atual</div><div class="v">'+fmt(curWeight(),1)+'<small>kg</small></div><div class="d">'+(since===null?'Sem pesagens':since===0?'Pesado hoje':'Há '+since+' dia'+(since>1?'s':''))+'</div></div>'
    + '<div class="kpi"><div class="lbl">Meta</div><div class="v">'+(goalW?fmt(goalW,1)+'<small>kg</small>':'–')+'</div><div class="d">'+(goalW?'Faltam '+fmt(Math.abs(curWeight()-goalW),1)+' kg':'Defina em Plano › Perfil')+'</div></div></div>';
  if (since !== null && since >= 7) h += '<div class="alert">Sua pesagem semanal está atrasada.</div>';
  if (ws.length > 1){
    h += '<div class="card"><div class="lbl">Peso (kg)</div>'+lineChart(ws.slice(-12).map(w => ({ y:w.kg, label:fmtD(w.d) })), 'var(--accent)');
    const wk = (ws[ws.length-1].kg - ws[0].kg) / Math.max(1, (parseK(ws[ws.length-1].d) - parseK(ws[0].d))/864e5/7);
    h += '<div class="sub">Ritmo médio: <b>'+(wk>0?'+':'')+fmt(wk,2)+' kg/semana</b>'+(S.profile.goal==='cut' && wk<-1 ? ' — rápido demais; considere comer um pouco mais.' : '')+'</div></div>';
  }
  const ev = measEvolution();
  if (ev.length){
    if (!ev.some(x => x.key === UI.mchart)) UI.mchart = ev[0].key;
    const sel = ev.find(x => x.key === UI.mchart);
    h += '<h2>Medidas</h2><div class="card"><div class="lbl">Evolução'+(lastM ? ' · última em '+fmtD(lastM.d) : '')+'</div><table class="mt"><thead><tr><th>Medida</th><th>Início</th><th>Atual</th><th>Δ</th></tr></thead><tbody>'
      + ev.map(x => { const good = x.goodDown ? x.diff < 0 : x.diff > 0;
          return '<tr data-act="mchart" data-k="'+x.key+'"'+(x.key===UI.mchart?' class="on"':'')+'><td>'+esc(x.name)+'</td><td>'+fmt(x.first,1)+'</td><td><b>'+fmt(x.last,1)+'</b></td>'
            + '<td class="'+(x.n>1 && x.diff ? (good?'up':'down') : '')+'">'+(x.n>1 ? (x.diff>0?'+':'')+fmt(x.diff,1) : '–')+'</td></tr>'; }).join('')
      + '</tbody></table><div class="sub">Toque numa medida para ver o gráfico. Verde = evolução a favor do objetivo (cintura/abdômen/% gordura caindo; braço, coxa, peito subindo).</div>'
      + '<div class="lbl" style="margin-top:12px">'+esc(sel.name)+'</div>'+lineChart(sel.pts.slice(-12).map(p => ({ y:p.v, label:fmtD(p.d) })), 'var(--ok)')
      + (num(lastM && lastM.m.cintura) && num(S.profile.height) ? '<div class="sub">Relação cintura/altura: <b>'+fmt(num(lastM.m.cintura)/num(S.profile.height),2)+'</b> (abaixo de 0,50 é o ideal de referência).</div>' : '')
      + '</div>';
  }
  const dates = [...new Set([...ws.map(w => w.d), ...ms.map(m => m.d)])].sort().reverse();
  if (dates.length) h += '<div class="card"><div class="lbl">Histórico</div><ul class="list">'
    + dates.map(d => { const w = ws.find(x => x.d === d), m = ms.find(x => x.d === d), wi = w ? ws.indexOf(w) : -1, df = wi > 0 ? w.kg - ws[wi-1].kg : 0;
        const mt = m ? Object.keys(m.m).filter(k => num(m.m[k])).length : 0;
        return '<li><span>'+fmtD(d)+(w ? ' · <b>'+fmt(w.kg,1)+' kg</b> <span class="'+(df<0?'up':df>0?'down':'')+'">'+(wi>0?'('+(df>0?'+':'')+fmt(df,1)+')':'')+'</span>' : '')
          + (mt ? '<br><span class="sub" style="margin:0">📏 '+mt+' medida'+(mt>1?'s':'')+(num(m.m.cintura)?' · cintura '+fmt(num(m.m.cintura),1):'')+(num(m.m.bf)?' · '+fmt(num(m.m.bf),1)+'% gord.':'')+'</span>' : '')+'</span>'
          + '<button class="x" data-act="delWeight" data-d="'+d+'" aria-label="Remover registro">×</button></li>'; }).join('')
    + '</ul></div>';
  return h;
}

function api(action, data){
  const payload = Object.assign({ action }, data || {});
  const fail = r => { const e = new Error((r && r.error) || 'Erro no servidor.'); e.code = r && r.code; return e; };
  if (HAS_GAS) return new Promise((res, rej) => google.script.run
    .withSuccessHandler(r => r && r.ok ? res(r) : rej(fail(r)))
    .withFailureHandler(() => rej(fail({ error:'Sem conexão com o servidor. Verifique a internet.' })))
    .api(payload));
  if (!API_URL) return Promise.reject(fail({ error:'Servidor não configurado.' }));
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const to = ctl && setTimeout(() => ctl.abort(), 40000);
  return fetch(API_URL, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(payload), signal: ctl && ctl.signal })
    .then(r => r.json()).catch(() => { throw fail({ error:'Sem conexão com o servidor. Verifique a internet e se a implantação está com acesso “Qualquer pessoa”.' }); })
    .then(r => { clearTimeout(to); if (!r.ok) throw fail(r); return r; });
}

/* ---------- sincronização (vale a última alteração salva) ---------- */
function schedulePush(){
  if (!ACC || ACC.mode !== 'cloud') return;
  SYNC.st = 'pending'; renderBrand();
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(push, 3000);
}
async function push(){
  clearTimeout(SYNC.timer);
  if (!ACC || ACC.mode !== 'cloud') return;
  SYNC.st = 'saving'; renderBrand();
  try {
    if (!S.updated) S.updated = Date.now();
    const r = await api('push', { token:ACC.token, state:JSON.stringify(S), tables:JSON.stringify(sheetTables()), updated:S.updated });
    if (r.user){ ACC.user = r.user; storeSession(); }
    SYNC.st = 'ok'; SYNC.at = Date.now();
  } catch(e){ if (handleAuthError(e)) return; SYNC.st = 'error'; SYNC.err = e.message; }
  renderBrand();
}
async function pull(){
  if (!ACC || ACC.mode !== 'cloud' || SYNC.pulling || SYNC.st === 'pending' || SYNC.st === 'saving') return;
  SYNC.pulling = true; SYNC.lastPull = Date.now();
  try {
    const r = await api('pull', { token:ACC.token });
    if (r.user){ ACC.user = r.user; storeSession(); }
    const remote = r.state ? JSON.parse(r.state) : null;
    if (remote && (remote.updated || 0) > (S.updated || 0)){
      S = normalize(remote); saveLocal(); SYNC.st = 'ok'; SYNC.at = Date.now(); render(true);
    } else if (!remote || (S.updated || 0) > (remote.updated || 0)){
      SYNC.pulling = false; await push();            // este aparelho tem a versão mais nova
    } else { SYNC.st = 'ok'; SYNC.at = Date.now(); }
  } catch(e){ if (!handleAuthError(e)){ SYNC.st = 'error'; SYNC.err = e.message; } }
  SYNC.pulling = false; renderBrand();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act; if (!/^(au|acc|adm)/.test(a)) return;
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const showMsg = (txt, bad) => { const el = document.getElementById('auMsg'); if (el) el.innerHTML = txt ? '<div class="alert" style="border-color:'+(bad?'var(--bad)':'var(--ok)')+'">'+esc(txt)+'</div>' : ''; else if (txt) alert(txt); };
  const run = async fn => {
    if (AUTH.busy) return; AUTH.busy = true;
    const old = t.textContent; t.disabled = true; t.textContent = 'Aguarde…'; showMsg('');
    try { await fn(); } catch(e){ if (!(ACC && handleAuthError(e))) showMsg(e.message, true); }
    finally { AUTH.busy = false; if (document.body.contains(t)){ t.disabled = false; t.textContent = old; } }
  };
  const go = () => { render(); const f = document.querySelector('.auth input'); if (f) f.focus(); };
  switch (a){
  case 'auMode': Object.assign(AUTH, { mode:t.dataset.m, step:1, ticket:'', msg:'', until:0 }); go(); return;
  case 'auStep': AUTH.step = +t.dataset.s; AUTH.until = 0; go(); return;
  case 'auShow': document.querySelectorAll('#auP,#auP2').forEach(i => i.type = i.type === 'password' ? 'text' : 'password'); return;
  case 'auLocal':
    if (!confirm('Sem conta, os dados ficam só neste aparelho e não vão para o Google Drive. Continuar?')) return;
    enter({ mode:'local' }); return;
  case 'auLogin': run(async () => {
    const email = val('auE').trim().toLowerCase(), password = val('auP'); AUTH.email = email;
    if (!emailOk(email)) throw new Error('Informe um e-mail válido.');
    if (!password) throw new Error('Informe a senha.');
    const r = await api('login', { email, password });
    enter({ mode:'cloud', token:r.token, user:r.user });
  }); return;
  case 'auCode': run(async () => {
    const email = AUTH.step === 1 ? val('auE').trim().toLowerCase() : AUTH.email;
    if (!emailOk(email)) throw new Error('Informe um e-mail válido.');
    if (AUTH.step === 2 && AUTH.until > Date.now()) throw new Error('Aguarde para pedir outro código.');
    await api('code', { email, purpose:AUTH.mode });
    Object.assign(AUTH, { email, step:2, until:Date.now() + 60000, msg:'Código enviado para '+email+'.' }); go();
  }); return;
  case 'auVerify': run(async () => {
    const code = val('auC').replace(/\D/g,'');
    if (code.length !== 6) throw new Error('O código tem 6 dígitos.');
    const r = await api('verify', { email:AUTH.email, code, purpose:AUTH.mode });
    Object.assign(AUTH, { ticket:r.ticket, step:3, msg:'E-mail confirmado!' }); go();
  }); return;
  case 'auRegister': case 'auReset': run(async () => {
    const name = val('auN').trim(), password = val('auP');
    if (a === 'auRegister' && name.length < 2) throw new Error('Informe seu nome.');
    if (!pwOk(password)) throw new Error('A senha precisa de ao menos 6 caracteres, com letra, número e caractere especial.');
    if (password !== val('auP2')) throw new Error('As senhas não conferem.');
    const r = a === 'auRegister' ? await api('register', { ticket:AUTH.ticket, name, password }) : await api('reset', { ticket:AUTH.ticket, password });
    if (r.pending){ Object.assign(AUTH, { mode:'login', step:1, msg: r.status === 'bloqueado' ? 'Senha alterada, mas a conta está bloqueada. Fale com o administrador.' : 'Pronto! Sua conta aguarda a aprovação do administrador. Você receberá um e-mail quando for liberada.' }); go(); return; }
    enter({ mode:'cloud', token:r.token, user:r.user });
  }); return;
  case 'accSync': if (ACC && ACC.mode === 'cloud'){ push().then(pull); } return;
  case 'accLogout':
    if (ACC.mode === 'cloud' && !confirm('Sair desta conta neste aparelho? Seus dados continuam salvos no Drive.')) return;
    logout(); return;
  case 'accName': {
    const n = val('accN').trim().slice(0,40);
    if (ACC.mode === 'cloud') run(async () => { if (n.length < 2) throw new Error('Informe um nome.'); const r = await api('profile', { token:ACC.token, name:n }); ACC.user = r.user; storeSession(); render(true); });
    else { S.appName = n; save(); render(true); }
    return; }
  case 'accPwOpen': UI.pwOpen = !UI.pwOpen; render(true); return;
  case 'accPw': run(async () => {
    const password = val('auP');
    if (!pwOk(password)) throw new Error('A nova senha precisa de ao menos 6 caracteres, com letra, número e caractere especial.');
    if (password !== val('auP2')) throw new Error('As senhas não conferem.');
    const r = await api('changePw', { token:ACC.token, current:val('accP0'), password });
    ACC.token = r.token; storeSession(); UI.pwOpen = false; render(true); alert('Senha alterada. Os outros aparelhos vão pedir login de novo.');
  }); return;
  case 'accSheet': run(async () => {
    await push();
    const r = await api('exportNow', { token:ACC.token }); ACC.user = r.user; storeSession(); render(true);
    if (r.url) window.open(r.url, '_blank', 'noopener');
  }); return;
  case 'admLoad': ADMIN.loaded = false; ADMIN.users = null; loadAdmin(); render(true); return;
  case 'admOp': {
    const email = t.dataset.e, op = t.dataset.op;
    const ask = { delete:'Excluir a conta '+email+'? Os dados e a planilha dela vão para a lixeira do seu Drive.', block:'Bloquear '+email+'? A pessoa sai de todos os aparelhos.', promote:'Dar acesso de administrador a '+email+'?' }[op];
    if (ask && !confirm(ask)) return;
    run(async () => { const r = await api('adminOp', { token:ACC.token, email, op }); adminApply(r); render(true); if (r.url) window.open(r.url, '_blank', 'noopener'); });
    return; }
  }
});

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t || !ACC) return;
  const a = t.dataset.act, id = t.dataset.id, i = +t.dataset.i, k = UI.sel;
  const plan = t.dataset.pid ? planById(t.dataset.pid) : null;
  switch (a){
  case 'tab': UI.tab = t.dataset.t; render(); window.scrollTo(0,0); return;
  case 'goToday': { const mi = MONTHS.findIndex(M => TODAY.startsWith(M.y+'-'+pad(M.m+1))); if (mi>=0) UI.month = mi;

  case 'month': { UI.month = i; const M = MONTHS[i]; UI.sel = TODAY.startsWith(M.y+'-'+pad(M.m+1)) ? TODAY : kOf(M.y,M.m,1); UI.sess = null; render(); return; }
  case 'sel': UI.sel = t.dataset.k; UI.sess = null; UI.cx = null; render(true); document.getElementById('detail').scrollIntoView({ behavior:'smooth', block:'start' }); return;
  case 'sess': UI.sess = t.dataset.p; render(true); return;
  case 'cxPick': UI.cx = t.dataset.t && UI.cx !== t.dataset.t ? t.dataset.t : null; render(true); return;
  case 'cxAdd': { const km = num(document.getElementById('cxK').value), mn = num(document.getElementById('cxM').value);
    if (!km && !mn){ alert('Informe a distância ou o tempo.'); return; }
    const n = document.getElementById('cxN');

    UI.cx = null; break; }
  case 'cxDel': S.extra[k] = (S.extra[k] || []).filter(x => x.id !== id); if (!S.extra[k].length) delete S.extra[k]; break;
  case 'dayDel': materialize(k); S.schedule[k] = S.schedule[k].filter(x => x !== t.dataset.p); break;
  case 'applyWeek': { const M = MONTHS[UI.month];
    for (let d=1; d<=daysIn(M.y,M.m); d++){ const kk = kOf(M.y,M.m,d); S.schedule[kk] = S.week[wkIdx(kk)].slice(); } break; }
  case 'clearMonth': { if (!confirm('Remover as sessões programadas deste mês? Os registros já feitos ficam guardados.')) return;
    const M = MONTHS[UI.month]; for (let d=1; d<=daysIn(M.y,M.m); d++) S.schedule[kOf(M.y,M.m,d)] = []; break; }
  case 'allSess': { const its = sessionItems(planById(UI.sess)), s = statsOf(k, its), v = s.done !== s.total;
    its.forEach(it => { const e = entry(k,it); e.done = v; if (e.sets) e.sets.forEach(x => x.d = v); }); break; }
  case 'open': { const kk = k+id; UI.open.has(kk) ? UI.open.delete(kk) : UI.open.add(kk); render(true); return; }
  case 'done': case 'sdone': case 'addset': case 'delset': {
    const it = findItem(id); if (!it) return; const e = entry(k,it);
    if (a==='done'){ e.done = !e.done; if (e.sets) e.sets.forEach(s => s.d = e.done); }
    else if (a==='sdone'){ e.sets[i].d = !e.sets[i].d; e.done = e.sets.every(s => s.d); }
    else if (a==='addset'){ e.sets.push({ r:'', k:'', d:false }); e.done = false; }
    else if (a==='delset' && e.sets.length > 1){ e.sets.pop(); e.done = e.sets.every(s => s.d); }
    break; }
  case 'rpe': { const D = S.day[k] || (S.day[k] = {}); const v = +t.dataset.v; D.rpe = D.rpe === v ? 0 : v; break; }
  case 'water': { const kk = UI.tab==='food' ? UI.fdate : TODAY; S.water[kk] = Math.max(0, (S.water[kk]||0) + (+t.dataset.ml)); break; }

    UI.pick = null; UI.q = ''; break; }
  case 'delFood': S.food[UI.fdate] = (S.food[UI.fdate]||[]).filter(x => x.id !== id); break;
  case 'toggleCustom': UI.custom = !UI.custom; render(true); return;
  case 'saveCustom': { const g = s => document.getElementById(s).value;
    if (!g('cfN').trim() || !num(g('cfK'))){ alert('Informe ao menos nome e kcal.'); return; }
    S.customFoods.push({ name:g('cfN').trim(), kcal:num(g('cfK')), p:num(g('cfP')), c:num(g('cfC')), f:num(g('cfF')), g:num(g('cfG'))||100 }); break; }
  case 'delCustom': S.customFoods.splice(i,1); break;
  case 'addWeight': { const d = document.getElementById('wD').value || TODAY, kg = num(document.getElementById('wK').value);
    const m = {}; if (UI.meas) MEAS_ALL.forEach(([key]) => { const el = document.getElementById('m_'+key); if (el && num(el.value)) m[key] = num(el.value); });
    if (!kg && !Object.keys(m).length){ alert('Informe o peso ou ao menos uma medida.'); return; }
    if (kg){ S.weights = S.weights.filter(w => w.d !== d); S.weights.push({ d, kg }); }
    if (Object.keys(m).length){ const ex = S.measures.find(x => x.d === d); if (ex) Object.assign(ex.m, m); else S.measures.push({ d, m }); }
    UI.meas = false; break; }
  case 'delWeight': if (!confirm('Remover peso e medidas de '+fmtD(t.dataset.d)+'?')) return;
    S.weights = S.weights.filter(w => w.d !== t.dataset.d); S.measures = S.measures.filter(x => x.d !== t.dataset.d); break;
  case 'toggleMeas': UI.meas = !UI.meas; render(true); return;
  case 'mchart': UI.mchart = t.dataset.k; render(true); return;
  case 'weekDel': S.week[i] = S.week[i].filter(x => x !== t.dataset.p); break;
  case 'resetWeek': if (!confirm('Voltar a ficha semanal para a versão original?')) return; S.week = DEFAULT_WEEK.map(d => d.slice()); break;
  case 'editPlan': UI.editPlan = UI.editPlan === id ? null : id; render(true); return;
  case 'exAdd': plan.ex.push({ id:uid(), name:'', sets:plan.type==='gym'?3:(plan.type==='mob'?2:0), reps:plan.type==='gym'?'10-12':'', muscle:'', group:'' }); break;
  case 'exDel': if (!confirm('Excluir "'+(plan.ex[i].name||'item')+'"?')) return; plan.ex.splice(i,1); break;
  case 'exUp': if (i>0) [plan.ex[i-1], plan.ex[i]] = [plan.ex[i], plan.ex[i-1]]; break;
  case 'exDown': if (i<plan.ex.length-1) [plan.ex[i+1], plan.ex[i]] = [plan.ex[i], plan.ex[i+1]]; break;
  case 'newPlan': { const ty = t.dataset.t; const p = { id:'p'+uid(), type:ty, name:'Nova sessão de '+TYPES[ty].n.toLowerCase(), focus:'', tag:'Novo',
      color:{gym:'#5b8def',run:'#12a37a',mob:'#8068f0',simple:'#8a97aa'}[ty], note:'', rest:'', intensity:'', min:ty==='mob'?25:50, km:ty==='run'?5:'', ex:[] };
    S.plans.push(p); UI.editPlan = p.id; break; }
  case 'dupPlan': { const p = JSON.parse(JSON.stringify(plan)); p.id = 'p'+uid(); p.name += ' (cópia)'; p.ex.forEach(e => e.id = uid()); S.plans.push(p); UI.editPlan = p.id; break; }
  case 'delPlan': { if (!confirm('Excluir "'+plan.name+'"? Ela sai da ficha e dos dias programados.')) return;
    S.plans = S.plans.filter(p => p !== plan); S.week = S.week.map(d => d.filter(x => x !== plan.id));
    for (const kk in S.schedule) if (Array.isArray(S.schedule[kk])) S.schedule[kk] = S.schedule[kk].filter(x => x !== plan.id); break; }
  case 'excel': exportExcel(); return;
  case 'export': downloadBlob(new Blob([JSON.stringify(S,null,1)], { type:'application/json' }), 'meu-treino-backup-'+TODAY+'.json'); return;
  case 'import': document.getElementById('importFile').click(); return;
  case 'reset': if (!confirm('Apagar TODOS os registros desta conta'+(ACC.mode==='cloud'?' (inclusive no Drive)':'')+'? Isso não pode ser desfeito.')) return;
    { const nm = S.appName; S = defaultState(); S.appName = nm; } break;
  default: return;
  }
  save(); render(true);
});

  else if (ds.ch === 'profile') S.profile[ds.k] = ['sex','goal'].includes(ds.k) ? t.value : (num(t.value) || t.value);
  else if (ds.ch === 'meal'){ UI.meal = +t.value; return; }
  else if (ds.ch === 'pcolor') planById(ds.pid).color = t.value;
  else if (ds.ch === 'ptype') planById(ds.pid).type = t.value;
  else if (ds.day === 'min' || ds.f || ds.pf){ render(true); return; }
  else if (t.id === 'importFile'){
    const file = t.files[0]; if (!file) return;
    file.text().then(txt => { try { const p = JSON.parse(txt); if (!p.plans) throw 0; S = normalize(p); save(); render(); alert('Dados importados.'); }
      catch(e){ alert('Arquivo inválido.'); } t.value = ''; });
    return;
  } else return;
  save(); render(true);
});

boot();
</script>
</body>
</html>
