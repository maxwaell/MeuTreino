<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8; --surface:#fff; --surface2:#e5ebf4; --ink:#0e1a2b; --mute:#566680;
  --line:#d3dcea; --accent:#1d6fe0; --ok:#12a37a; --warn:#e8a317; --bad:#e2504a; --water:#2aa7e0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0c1626; --surface:#142238; --surface2:#1b2d49; --ink:#eaf1fb; --mute:#92a6c2;
    --line:#26395a; --accent:#4aa3ff; --ok:#3ddc97; --warn:#f2b53a; --bad:#ff6b63; --water:#4cc3f5; }
}
html{background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
button,select,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:8px 12px calc(92px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4aa3ff,#1d6fe0 55%,#12a37a);display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(29,111,224,.35)}
.brand .logo svg{width:19px;height:19px}
.brand b{font:700 19px/1 'Barlow Condensed',sans-serif;letter-spacing:1.4px;text-transform:uppercase}
h1{margin:0;font:700 48px/.85 'Barlow Condensed',Impact,sans-serif;letter-spacing:-.5px}
h2{margin:26px 0 10px;font:700 24px/1 'Barlow Condensed',sans-serif}
.yr{font:600 18px 'Barlow Condensed',sans-serif;color:var(--mute);margin-left:5px}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sum{font-size:14px;color:var(--mute);text-align:right;line-height:1.25}
.sum b{display:block;font:700 28px/1 'Barlow Condensed',sans-serif;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.lbl{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi .v{font:700 34px/1 'Barlow Condensed',sans-serif;margin-top:6px}
.kpi .v small{font-size:16px;color:var(--mute);margin-left:3px}
.kpi .d{font-size:12.5px;color:var(--mute);margin-top:4px}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ring{position:relative;width:86px;height:86px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font:700 19px/1 'Barlow Condensed',sans-serif}
.ring + div{font-size:12.5px;color:var(--mute);margin-top:6px}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.list li:first-child{border-top:0}
.list li > span:last-child{font-weight:600;white-space:nowrap}
.alert{padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:14px;margin-top:10px;border-left:3px solid var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.pill:active{background:var(--surface2)}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.danger{color:var(--bad)}
.pill[disabled]{opacity:.5}
a.pill{text-decoration:none;color:inherit;display:inline-block}
a.pill.pri{color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead h1{font-size:36px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 11px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{margin:10px 0 4px}
.dow span{text-align:center;font-size:11.5px;font-weight:600;color:var(--mute)}
.dow span:first-child{color:var(--accent)}
.cell{display:flex;flex-direction:column;align-items:center;gap:0;min-height:54px;padding:4px 2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.cell.empty{background:transparent;border:1px dashed var(--line)}
.cell .dn{font:700 18px/1 'Barlow Condensed',sans-serif}
.cell .tg{font-size:9.5px;color:var(--mute);line-height:1.15;white-space:nowrap;overflow:hidden;max-width:100%;margin-top:1px}
.cell .ic{font-size:10px;line-height:1.15;letter-spacing:-1px}
.cell .bar{margin-top:auto;width:100%;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--c)}
.cell.today{border-color:var(--accent);border-width:2px}
.cell.today .dn{color:var(--accent)}
.cell.sel{background:var(--surface2);border-color:var(--c,var(--accent));box-shadow:inset 0 0 0 1px var(--c,var(--accent))}
.cell.full .dn::after{content:"\2713";font-size:11px;margin-left:1px;color:var(--ok)}
.pad{visibility:hidden}
.calsum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-top:6px}
#detail{margin-top:20px;scroll-margin-top:10px}
.dh{display:flex;align-items:flex-end;gap:14px}
.big{font:700 76px/.78 'Barlow Condensed',sans-serif;color:var(--c);min-width:56px}
.dh .wd{font-size:14px;color:var(--mute)}
.dh .tt{font:700 26px/1 'Barlow Condensed',sans-serif;margin:2px 0}
.dh .fc{font-size:15px;color:var(--mute)}
.stabs{display:flex;gap:8px;overflow-x:auto;margin-top:16px;scrollbar-width:none}
.stab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 13px;text-align:left;min-width:120px}
.stab .sn1{display:block;font-weight:600;font-size:15px;white-space:nowrap}
.stab .sn2{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.stab.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface2)}
.stab.ok .sn2{color:var(--ok);font-weight:600}
.shd{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c)}
.shdrow{display:flex;gap:10px;align-items:flex-start}
.shdtxt{flex:1;min-width:0}
.shd .t1{font:700 22px/1.05 'Barlow Condensed',sans-serif}
.shd .t2{font-size:14px;color:var(--mute);margin-top:3px}
.shd .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tagx{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--ink)}
.shd p{margin:10px 0 0;font-size:14px;color:var(--mute)}
.grp{margin:18px 2px 0;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--c)}
.prog{display:flex;align-items:center;gap:10px;margin-top:16px}
.track{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);transition:width .2s}
.ptxt{font-size:14px;font-weight:600;min-width:52px;text-align:right}
select,.inp{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);font-size:16px;padding:0 10px;width:100%}
textarea.inp{height:70px;padding:8px 10px;resize:vertical}
.item{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item.done{border-color:var(--c)}
.ih{display:grid;grid-template-columns:52px 1fr 36px;align-items:center}
.chk{width:34px;height:34px;margin:0 0 0 12px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.item.done .chk{background:var(--c)}
.item.done .chk svg{opacity:1}
.main{background:none;border:0;text-align:left;padding:13px 6px;min-width:0}
.main .nm{display:block;font-size:17px;font-weight:600;line-height:1.2}
.item.done .nm{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.main .mt{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.main .mt b{color:var(--ink);font-weight:600}
.main .last{display:block;font-size:12.5px;color:var(--accent);margin-top:2px;font-weight:500}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.chev{width:20px;height:20px;justify-self:center;transition:transform .15s;color:var(--mute)}
.item.open .chev{transform:rotate(180deg)}
.sets{padding:2px 12px 14px;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.shead{margin-top:10px;font-size:12px;color:var(--mute);text-align:center;font-weight:600}
.sn{font:700 20px 'Barlow Condensed',sans-serif;color:var(--mute);text-align:center}
.sets input,.cardio input,.num{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);text-align:center;font:600 18px 'Barlow',sans-serif;padding:0 6px}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.55;font-weight:400}
.sc{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.sc svg{width:20px;height:20px;opacity:0}
.sc.on{background:var(--ok);border-color:var(--ok)}
.sc.on svg{opacity:1}
.sbtns{display:flex;gap:8px;margin-top:12px}
.cardio{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 12px 14px;border-top:1px solid var(--line)}
.cardio .pace{grid-column:1/-1;font-size:13px;color:var(--mute);text-align:center}
.cardio label,.f label{font-size:12px;color:var(--mute);font-weight:600;display:block;margin:10px 0 4px}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.rpe button{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:600;padding:0}
.rpe button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);border-radius:10px;padding:6px 6px 6px 10px;font-size:14px;font-weight:600;margin:6px 6px 0 0}
.stag button{border:0;background:var(--surface2);width:24px;height:24px;border-radius:50%;padding:0;line-height:1}
.cxg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cxb{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 2px;font-size:11.5px;font-weight:600;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:3px}
.cxb span{font-size:20px;line-height:1}
.cxb.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.fig{width:132px;flex:none}
.fig svg{width:100%;height:auto;display:block}
.fig.lg{width:230px;margin:6px auto 0}
.rg{fill:var(--surface2);stroke:var(--line);stroke-width:.8}
.bb{fill:var(--surface2);stroke:var(--line);stroke-width:.8}
.figlbl{font:600 9px 'Barlow',sans-serif;fill:var(--mute)}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:10px;font-size:13.5px}
.mlist span{display:flex;justify-content:space-between;gap:6px}
.mlist b{font-weight:600}
.hero{display:flex;gap:14px;align-items:center}
.hero svg{width:96px;flex:none}
.lib{margin-top:14px;padding:10px 10px 4px;border-radius:14px;background:var(--surface2)}
.lib .inp{background:var(--surface)}
.lib .chip{background:var(--surface)}
.lib .chip.on{background:var(--ink)}
.libres{max-height:360px;overflow-y:auto;margin-top:6px}
.libres button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 2px;text-align:left}
.libres button:first-child{border-top:0}
.libres .ln{flex:1;min-width:0}
.libres .ln b{display:block;font-weight:600;font-size:15px}
.libres .ln small{color:var(--mute);font-size:12.5px}
.libres .add{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.libres .add.in{background:var(--ok)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tpl{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;border-top:4px solid var(--c)}
.tpl b{display:block;font-size:14.5px;line-height:1.2}
.tpl small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.tpl.wide2{grid-column:1/-1}
.f{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f .full{grid-column:1/-1}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.food:first-of-type{border-top:0}
.food .fn{font-weight:600;font-size:15px}
.food .fm{font-size:12.5px;color:var(--mute)}
.x{border:0;background:var(--surface2);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;flex:none;padding:0}
.res button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 2px;font-size:15px}
.res button span:last-child{color:var(--mute);font-size:13px}
.macro{display:grid;grid-template-columns:72px 1fr 92px;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.macro .track{height:10px}
.macro span:last-child{text-align:right;font-weight:600}
.meal{margin-top:14px}
.meal .mh{display:flex;justify-content:space-between;font-weight:600;font-size:14px;color:var(--mute)}
.water{display:flex;align-items:center;gap:14px}
.glass{width:46px;height:64px;border:2px solid var(--water);border-top:0;border-radius:0 0 10px 10px;position:relative;overflow:hidden;flex:none}
.glass i{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.85}
.datenav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.datenav b{font:700 22px 'Barlow Condensed',sans-serif}
.datenav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px}
.ex-ed{display:grid;grid-template-columns:1fr 52px 76px;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ex-ed .inp{height:40px;font-size:15px}
.ex-ed .w2{grid-column:1/2}
.ex-ed .ctr{grid-column:2/4;display:flex;gap:4px;justify-content:flex-end}
.ex-ed .ctr button{width:34px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);padding:0}
.ex-ed .full{grid-column:1/-1}
.plan-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;text-align:left;padding:0}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.plan-h .pn{font-weight:600;font-size:17px}
.plan-h .pf{font-size:13px;color:var(--mute)}
.wk{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk > span{font-weight:600;padding-top:8px}
.wk select{height:38px;font-size:14px;margin-top:6px}
.tsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px}
.tsum b{display:block;font:700 30px/1 'Barlow Condensed',sans-serif}
.tsum span{font-size:12.5px;color:var(--mute)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.mgrid label{font-size:12px;color:var(--mute);font-weight:600;display:block;margin:10px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.mt{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
table.mt th{text-align:right;font-size:12px;color:var(--mute);font-weight:600;padding:4px 6px}
table.mt th:first-child,table.mt td:first-child{text-align:left}
table.mt td{text-align:right;padding:9px 6px;border-top:1px solid var(--line)}
table.mt tr[data-act]{cursor:pointer}
table.mt tr.on td{background:var(--surface2)}
.auth{max-width:420px;margin:3vh auto 0}
.auth .lead{color:var(--mute);margin:10px 0 4px}
.wide{width:100%;height:50px;font-size:16px;margin-top:16px}
.inp.code{letter-spacing:12px;font:700 30px 'Barlow Condensed',sans-serif;text-align:center;height:62px}
.steps{display:flex;gap:6px;margin:16px 0 4px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--surface2)}
.steps span.on{background:var(--accent)}
.pwck{list-style:none;padding:0;margin:10px 0 0;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pwck li{color:var(--mute)}.pwck li.ok{color:var(--ok);font-weight:600}
.pwck li::before{content:'○ '}.pwck li.ok::before{content:'✓ '}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 0;font-size:14.5px}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.or{text-align:center;color:var(--mute);font-size:13px;margin:22px 0 4px}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);font-weight:600;white-space:nowrap}
.badge.ativo{color:var(--ok)}.badge.pendente{color:var(--warn)}.badge.bloqueado{color:var(--bad)}
.usr{padding:12px 0;border-top:1px solid var(--line)}
.usr:first-of-type{border-top:0}
.foot{margin-top:28px;font-size:12.5px;color:var(--mute);text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mute);padding:6px 0}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}
@media (min-width:520px){.tabs{max-width:480px;margin:0 auto;border:1px solid var(--line);border-radius:18px 18px 0 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap"><div class="brand" id="brand"></div><div id="view"></div></div>

const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function musclesOf(name){
  const n = norm(name), hit = LIB.find(x => norm(x.n) === n) || LIB.find(x => n.includes(norm(x.n)) || norm(x.n).includes(n));
  if (hit) return hit.m;
  const R = [['supino|crucifixo|cross|peito',['peito']],['puxada|remada|barra fixa|pulldown',['costas','biceps']],['desenvolvimento|elevacao lateral|ombro',['ombros']],
    ['rosca',['biceps']],['triceps',['triceps']],['agachamento|leg press|extensora|afundo',['quadriceps','gluteos']],['flexora|stiff|terra',['posteriores']],
    ['gluteo|hip|pelvica|abdutora',['gluteos']],['adutora',['adutores']],['panturrilha',['panturrilhas']],['lombar',['lombar']],['abdom|crunch|prancha',['abdomen']]];
  for (const [re, m] of R) if (new RegExp(re).test(n)) return m;
  return [];
}

function defaultState(){

let storageOK = true, S = defaultState(), SCOPE = null;
/* converte dados de versões anteriores sem perder registros */
function normalize(o){
  const s = Object.assign(defaultState(), o || {});
  ['extra','schedule','logs','day','water','food'].forEach(k => { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
  ['measures','weights','customFoods','plans'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  s.profile = Object.assign(defaultState().profile, s.profile || {});
  if (!o || !o.wd){                                  // versões antigas guardavam "week" como lista começando no domingo
    const wd = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    if (Array.isArray(s.week) && s.week.length === 7) s.week.forEach((a,i) => wd[i] = Array.isArray(a) ? a.slice() : []);
    s.wd = wd;
  }
  delete s.week;
  s.plans.forEach(p => { if (!Array.isArray(p.ex)) p.ex = []; p.ex.forEach((e,j) => { if (!e.id) e.id = 'e'+j+uid(); if (!e.mk) e.mk = musclesOf(e.name); }); });
  s.weights.forEach(w => {                           // cintura/% gordura antigos viram medidas
    if (w.waist || w.bf){ let m = s.measures.find(x => x.d === w.d); if (!m) s.measures.push(m = { d:w.d, m:{} });
      if (w.waist && !m.m.cintura) m.m.cintura = w.waist; if (w.bf && !m.m.bf) m.m.bf = w.bf; }
    delete w.waist; delete w.bf; });
  return s;
}
function loadLocal(scope){
  try { const raw = localStorage.getItem(KEY + ':' + scope); if (raw) return normalize(JSON.parse(raw)); } catch(e){ storageOK = false; }
  return defaultState();
}

const planById = id => S.plans.find(p => p.id === id);
function sessionIds(k){
  if (Array.isArray(S.schedule[k])) return S.schedule[k];
  if (S.from && k < S.from) return [];
  return S.wd[parseK(k).getDay()] || [];
}

function sessionItems(p){
  if (p.type === 'run') return [{ id:p.id+':run', kind:'cardio', name:p.name, km:num(p.km), sets:0, reps:'', group:'', mk:['quadriceps','panturrilhas'] }];
  return p.ex.map(e => ({ id:p.id+':'+e.id, kind: p.type === 'gym' ? 'ex' : (p.type === 'mob' ? 'mob' : 'simple'),
    name:e.name, sets: p.type === 'gym' ? (+e.sets || 0) : 0, psets:+e.sets || 0, reps:e.reps || '', group:e.group || '', mk:e.mk || musclesOf(e.name) }));
}
const items = k => sessions(k).flatMap(sessionItems);

const peek = (k,id) => (S.logs[k] && S.logs[k][id]) || null;
function entry(k, it){
  const L = S.logs[k] || (S.logs[k] = {});
  let e = L[it.id];
  if (!e){ e = { n:it.name, done:false }; if (it.sets) e.sets = newSets(it.sets); if (it.kind === 'cardio'){ e.cardio = true; e.tk = it.km; e.km = ''; e.min = ''; } L[it.id] = e; }
  return e;
}
function statsOf(k, its){ const done = its.filter(it => { const e = peek(k, it.id); return e && e.done; }).length; return { done, total:its.length }; }
function stats(k){ const its = items(k); return its.length ? statsOf(k, its) : null; }
function lastFor(name, k){
  const keys = Object.keys(S.logs).filter(x => x < k).sort().reverse();
  for (const d of keys) for (const id in S.logs[d]){
    const e = S.logs[d][id];
    if (e.n === name && e.sets){ const w = e.sets.filter(s => s.k !== ''); if (w.length){ const s = w[w.length-1]; return (s.r ? s.r+' × ' : '')+s.k+' kg · '+fmtD(d); } }
  }
  return null;
}
const kmFromText = t => { const m = String(t||'').match(/(\d+[.,]?\d*)\s*km/i); return m ? num(m[1]) : 0; };
function dayMetrics(k){
  let vol = 0, sets = 0, km = 0, cmin = 0, mob = 0, gym = 0;
  const L = S.logs[k] || {};
  for (const id in L){ const e = L[id];
    if (e.sets) e.sets.forEach(s => { if (s.d || (s.r !== '' && s.k !== '')){ vol += num(s.r)*num(s.k); if (s.d) sets++; } });
    if (e.cardio || id === 'c'){ km += num(e.km) || (e.done ? (num(e.tk) || kmFromText(e.n)) : 0); cmin += num(e.min); } }
  (S.extra[k] || []).forEach(x => { const c = cardioById(x.t); if (c[4]) km += num(x.km); cmin += num(x.min); });
  sessions(k).forEach(p => { const s = statsOf(k, sessionItems(p)); if (s.total && s.done === s.total){ if (p.type === 'mob' || p.type === 'simple') mob++; if (p.type === 'gym') gym++; } });
  return { vol, sets, km, cmin, mob, gym };
}
function eachDay(fn){ MONTHS.forEach(M => { for (let d=1; d<=daysIn(M.y,M.m); d++) fn(kOf(M.y,M.m,d)); }); }
function weekTargets(){
  const t = { gym:0, km:0, mob:0, sets:0 };
  for (let i=0; i<7; i++) (S.wd[i] || []).forEach(id => { const p = planById(id); if (!p) return;
    if (p.type === 'gym'){ t.gym++; t.sets += p.ex.reduce((a,e) => a + (+e.sets||0), 0); }
    else if (p.type === 'run') t.km += num(p.km); else t.mob++; });

}
/* aplica uma nova semana a partir de hoje, preservando o que já passou */
function applyWeek(wd){
  const from = S.from && S.from > ORIGIN ? S.from : ORIGIN;
  for (let k = from; k < TODAY; k = addDays(k,1)) if (!Array.isArray(S.schedule[k])) S.schedule[k] = sessionIds(k).slice();
  for (const k in S.schedule) if (k >= TODAY) delete S.schedule[k];
  if (!S.from) S.from = TODAY;
  S.wd = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  for (const d in wd) S.wd[d] = wd[d].slice();
}
function clonePlan(src, id){
  const p = JSON.parse(JSON.stringify(src)); p.id = id; p.ex = (p.ex || []).map((e,j) => Object.assign({}, e, { id:e.id || 'e'+j, mk:e.mk || musclesOf(e.name) }));
  ['focus','note','rest','intensity','tag'].forEach(f => { if (p[f] == null) p[f] = ''; }); if (!p.tag) p.tag = p.name.split(' ').slice(-1)[0].slice(0,8);

function useWeekTemplate(t){
  const map = {};
  t.plans().forEach(src => { const base = src.id || src.k, id = t.k === 'max' ? src.id : 'p'+uid();
    const old = planById(id); if (old) S.plans = S.plans.filter(p => p !== old);
    S.plans.forEach(p => { if (p.name === src.name && !p.name.endsWith('(antiga)')) p.name += ' (antiga)'; });
    S.plans.push(clonePlan(src, id)); map[base] = id; });

const curWeight = () => { const ws = [...S.weights].sort((a,b) => a.d < b.d ? -1 : 1); return ws.length ? ws[ws.length-1].kg : (num(S.profile.weight) || 70); };
function bmr(){ const p = S.profile, w = curWeight(); return Math.round(10*w + 6.25*(num(p.height)||170) - 5*(num(p.age)||30) + (p.sex === 'f' ? -161 : 5)); }
function exerciseKcal(k){
  const w = curWeight(); let kcal = 0;
  sessions(k).forEach(p => { if (p.type === 'run') return; const s = statsOf(k, sessionItems(p)); if (!s.done) return;
    const min = p.type === 'gym' && num((S.day[k]||{}).min) ? num(S.day[k].min) : (num(p.min) || 45) * s.done / s.total;
    kcal += (p.type === 'gym' ? 5 : p.type === 'mob' ? 2.5 : 3) * w * min / 60; });
  kcal += dayMetrics(k).km * w;
  (S.extra[k] || []).forEach(x => { const c = cardioById(x.t); if (c[4] && num(x.km)) return; kcal += c[3] * w * num(x.min) / 60; });
  return Math.round(kcal);
}

function heat(v, max){
  if (!v) return null;
  const t = Math.max(.15, Math.min(1, v / (max || 1)));
  const a = [255,196,92], b = [226,64,58], c = a.map((x,i) => Math.round(x + (b[i]-x)*t));
  return 'rgb('+c.join(',')+')';
}
/* vol: { musculo: valor } */
function bodyFigure(vol, big){
  const max = Math.max(1, ...Object.values(vol));
  const g = parts => parts.map(([m, shape]) => { const f = heat(vol[m] || 0, max);
    return '<g class="rg"'+(f ? ' style="fill:'+f+';stroke:'+f+'"' : '')+'><title>'+MUS[m]+(vol[m] ? ': '+fmt(vol[m]) : '')+'</title>'+shape+'</g>'; }).join('');
  return '<div class="fig'+(big?' lg':'')+'"><svg viewBox="0 0 200 172" role="img" aria-label="Músculos trabalhados">'
    + silhouette(50) + silhouette(150) + g(BODY_FRONT) + g(BODY_BACK)
    + '<text class="figlbl" x="50" y="171" text-anchor="middle">Frente</text><text class="figlbl" x="150" y="171" text-anchor="middle">Costas</text></svg></div>';
}
function planMuscles(p){ const v = {}; (p.ex || []).forEach(e => (e.mk || musclesOf(e.name)).forEach((m,i) => { v[m] = (v[m]||0) + (+e.sets || 1) * (i ? .5 : 1); })); return v; }
function weekMuscles(){ const v = {}; for (let d=0; d<7; d++) (S.wd[d] || []).forEach(id => { const p = planById(id); if (p && p.type === 'gym') (p.ex||[]).forEach(e => { const m = (e.mk || musclesOf(e.name))[0]; if (m) v[m] = (v[m]||0) + (+e.sets||0); }); }); return v; }
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 10 18 20 6.5"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
function ring(v, goal, color, label, sub){
  const r = 36, c = 2*Math.PI*r, p = Math.min(1, goal ? v/goal : 0);
  return '<div><div class="ring"><svg width="86" height="86" viewBox="0 0 86 86"><circle cx="43" cy="43" r="'+r+'" fill="none" stroke="var(--surface2)" stroke-width="8"/>'
    + '<circle cx="43" cy="43" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'"/></svg>'
    + '<div class="rv">'+label+'</div></div><div>'+sub+'</div></div>';
}
function barChart(data, k1, k2, c1, c2){
  const W = 320, H = 130, n = data.length, bw = W / n, m1 = Math.max(1, ...data.map(d => d[k1])), m2 = Math.max(1, ...data.map(d => d[k2]));
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+(H+18)+'">';
  data.forEach((d,i) => { const x = i*bw, h1 = (d[k1]/m1)*(H-10), h2 = (d[k2]/m2)*(H-10);
    s += '<rect x="'+(x+bw*.18)+'" y="'+(H-h1)+'" width="'+(bw*.3)+'" height="'+h1+'" rx="3" fill="'+c1+'"/>'
       + '<rect x="'+(x+bw*.52)+'" y="'+(H-h2)+'" width="'+(bw*.3)+'" height="'+h2+'" rx="3" fill="'+c2+'"/>'
       + '<text x="'+(x+bw/2)+'" y="'+(H+13)+'" text-anchor="middle" font-size="10" fill="var(--mute)">'+d.label+'</text>'; });
  return s + '</svg>';
}
function lineChart(pts, color){
  if (pts.length < 2) return '';
  const W = 320, H = 120, ys = pts.map(p => p.y), mn = Math.min(...ys), mx = Math.max(...ys), rg = (mx - mn) || 1;
  const X = i => 14 + i*(W-28)/(pts.length-1), Y = v => 12 + (H-24)*(1-(v-mn)/rg);
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+(H+16)+'"><polyline fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map((p,i) => X(i)+','+Y(p.y)).join(' ')+'"/>';
  pts.forEach((p,i) => { s += '<circle cx="'+X(i)+'" cy="'+Y(p.y)+'" r="3.5" fill="'+color+'"/>'
    + ((i === 0 || i === pts.length-1 || pts.length <= 6) ? '<text x="'+X(i)+'" y="'+(Y(p.y)-7)+'" text-anchor="middle" font-size="10" fill="var(--ink)">'+fmt(p.y,1)+'</text><text x="'+X(i)+'" y="'+(H+13)+'" text-anchor="middle" font-size="9.5" fill="var(--mute)">'+p.label+'</text>' : ''); });
  return s + '</svg>';
}

function weekData(start){
  const w = { start, label:fmtD(start), vol:0, km:0, sets:0, mob:0, gym:0, rpe:[] };
  for (let j=0; j<7; j++){ const d = addDays(start,j), m = dayMetrics(d);
    w.vol += m.vol; w.km += m.km; w.sets += m.sets; w.mob += m.mob; w.gym += m.gym; const r = (S.day[d]||{}).rpe; if (r) w.rpe.push(r); }
  return w;
}

function renderWeight(){
  const ws = [...S.weights].sort((a,b) => a.d < b.d ? -1 : 1), last = ws[ws.length-1], prev = ws[ws.length-2];
  const lastM = measList().slice(-1)[0], ev = measEvolution(), hm = num(S.profile.height);
  let h = '<h1>Corpo</h1><div class="sub">Pese-se e meça a cintura uma vez por semana, no mesmo dia e horário, em jejum.</div>';
  h += '<div class="card"><div class="lbl">Novo registro</div><div class="f"><div><label>Data</label><input class="inp" type="date" id="wD" value="'+TODAY+'"></div>'
    + '<div><label>Peso (kg)</label><input class="num" id="wK" inputmode="decimal" placeholder="'+(last ? fmt(last.kg,1) : '70')+'"></div></div>'
    + '<button class="link" data-act="toggleMeas">'+(UI.meas ? '▾' : '▸')+' 📏 Medidas (cm) e % de gordura</button>';
  if (UI.meas) h += '<div class="mgrid">'+MEAS_ALL.map(([key,name,tip]) => '<div><label for="m_'+key+'" title="'+esc(tip)+'">'+name+'</label><input class="num" id="m_'+key+'" inputmode="decimal" placeholder="'+(lastM && num(lastM.m[key]) ? fmt(num(lastM.m[key]),1) : '')+'"></div>').join('')+'</div>';

    const weeks = ws.length > 1 ? Math.max(1, (parseK(last.d) - parseK(first.d)) / 6048e5) : 0, rate = weeks ? (last.kg - first.kg) / weeks : 0;
    h += '<div class="kpis" style="margin-top:10px"><div class="kpi"><div class="lbl">Peso</div><div class="v">'+fmt(last.kg,1)+'<small>kg</small></div><div class="d">'
      + (prev ? (last.kg <= prev.kg ? '<span class="up">' : '<span class="down">')+(last.kg - prev.kg > 0 ? '+' : '')+fmt(last.kg - prev.kg,1)+' kg vs anterior</span>' : 'Primeira pesagem')+'</div></div>'
      + '<div class="kpi"><div class="lbl">IMC</div><div class="v">'+fmt(imc,1)+'</div><div class="d">'+(num(S.profile.goalWeight) ? 'Meta: '+fmt(num(S.profile.goalWeight),1)+' kg' : 'Defina um peso-meta em Plano')+'</div></div></div>';
    if (rate < -0.01*last.kg) h += '<div class="alert">Você está perdendo mais de 1% do peso por semana ('+fmt(rate,2)+' kg/sem). Rápido demais para manter massa: coma um pouco mais.</div>';
    else if (S.profile.goal !== 'bulk' && rate > 0.15 && ws.length > 2){ const w = ev.find(x => x.key === 'cintura');
      h += '<div class="alert">O peso está subindo ('+fmt(rate,2)+' kg/sem).'+(w && w.diff > 0 ? ' A cintura também subiu: reduza cerca de 150 kcal/dia.' : ' Se a cintura estiver estável, pode ser ganho de massa.')+'</div>'; }
    if (ws.length > 1) h += '<div class="card"><div class="lbl">Evolução do peso</div>'+lineChart(ws.slice(-12).map(w => ({ y:w.kg, label:fmtD(w.d) })), 'var(--accent)')+'</div>';
  }

      + ev.map(x => { const good = x.goodDown ? x.diff < 0 : x.diff > 0;
        return '<tr data-act="mchart" data-k="'+x.key+'" class="'+(UI.mchart === x.key ? 'on' : '')+'"><td>'+x.short+'</td><td>'+fmt(x.first,1)+'</td><td>'+fmt(x.last,1)+'</td>'
          + '<td class="'+(x.n > 1 && x.diff ? (good ? 'up' : 'down') : '')+'">'+(x.n > 1 ? (x.diff > 0 ? '+' : '')+fmt(x.diff,1) : '–')+'</td></tr>'; }).join('')+'</table>';
    const w = ev.find(x => x.key === 'cintura'); if (w && hm) h += '<div class="sub">Cintura/altura: <b>'+fmt(w.last/hm,2)+'</b> (abaixo de 0,50 é o recomendado)</div>';
    const sel = ev.find(x => x.key === UI.mchart); if (sel && sel.pts.length > 1) h += lineChart(sel.pts.map(p => ({ y:p.v, label:fmtD(p.d) })), 'var(--ok)');
    h += '</div>';
  }
  const dates = [...new Set([...ws.map(w => w.d), ...measList().map(m => m.d)])].sort().reverse();
  if (dates.length) h += '<div class="card"><div class="lbl">Histórico</div><ul class="list">'+dates.map(d => { const w = ws.find(x => x.d === d), m = (S.measures||[]).find(x => x.d === d);

      return '<li><span>'+fmtD(d)+'/'+d.slice(2,4)+(nm ? ' <span class="sub" style="margin:0">· '+nm+' medida'+(nm > 1 ? 's' : '')+'</span>' : '')+'</span><span>'+(w ? fmt(w.kg,1)+' kg ' : '')
        + '<button class="x" data-act="delWeight" data-d="'+d+'" aria-label="Apagar registro de '+fmtD(d)+'">×</button></span></li>'; }).join('')+'</ul></div>';
  return h;
}

/* =========================================================
   PLANILHA DIÁRIA NO DRIVE (o servidor monta a planilha com estas tabelas)
   ========================================================= */
function sheetTables(){
  try {
    const H = a => a.map(v => [v,'h']), DT = k => [k,'date'], D1 = v => [Math.round(v*10)/10,'d1'], IN = v => [Math.round(v),'int'];
    const days = []; eachDay(k => days.push(k));
    Object.keys(S.logs).concat(Object.keys(S.extra), Object.keys(S.food), Object.keys(S.water)).forEach(k => { if (!days.includes(k)) days.push(k); });
    days.sort();
    const tr = [H(['Data','Dia','Programado','Itens feitos','Itens totais','Volume (kg)','Séries','Km','Esforço','Gasto (kcal)','Anotações'])];
    days.filter(k => S.logs[k] || S.extra[k] || (k <= TODAY && sessions(k).length)).forEach(k => {
      const st = stats(k) || { done:0, total:0 }, m = dayMetrics(k), d = S.day[k] || {};
      tr.push([DT(k), WEEK[wkIdx(k)], sessions(k).map(p => p.name).join(' + ') || 'Livre', IN(st.done), IN(st.total), IN(m.vol), IN(m.sets), D1(m.km), d.rpe ? IN(d.rpe) : '', IN(exerciseKcal(k)), d.note || '']); });
    const se = [H(['Data','Exercício','Série','Repetições','Carga (kg)','Feita'])], hist = {};
    Object.keys(S.logs).sort().forEach(k => { for (const id in S.logs[k]){ const e = S.logs[k][id]; if (!e.sets) continue;
      e.sets.forEach((s,i) => { if (s.r === '' && s.k === '' && !s.d) return; se.push([DT(k), e.n, IN(i+1), s.r === '' ? '' : IN(num(s.r)), s.k === '' ? '' : D1(num(s.k)), s.d ? 'Sim' : 'Não']); });
      const mx = Math.max(0, ...e.sets.map(s => num(s.k))); if (mx) (hist[e.n] || (hist[e.n] = [])).push({ k, kg:mx }); } });
    const ev = [H(['Exercício','Treinos','Carga inicial','Carga atual','Recorde','Evolução (kg)','Histórico'])];
    Object.keys(hist).sort().forEach(n => { const h = hist[n], f = h[0], l = h[h.length-1];
      ev.push([[n,'b'], IN(h.length), D1(f.kg), D1(l.kg), D1(Math.max(...h.map(x => x.kg))), D1(l.kg - f.kg), h.map(x => fmtD(x.k)+': '+fmt(x.kg,1)).join(' → ')]); });
    const ca = [H(['Data','Origem','Modalidade','Km','Tempo (min)'])];
    days.forEach(k => { for (const id in (S.logs[k] || {})){ const e = S.logs[k][id]; if (!e.cardio) continue; const km = num(e.km) || (e.done ? num(e.tk) : 0); if (km || num(e.min)) ca.push([DT(k), 'Ficha', e.n, D1(km), num(e.min) ? IN(num(e.min)) : '']); }
      (S.extra[k] || []).forEach(x => { const c = cardioById(x.t); ca.push([DT(k), 'Avulso', x.t === 'outro' && x.n ? x.n : c[1], num(x.km) ? D1(num(x.km)) : '', num(x.min) ? IN(num(x.min)) : '']); }); });
    const nu = [H(['Data','Consumido (kcal)','Proteína (g)','Carbo (g)','Gordura (g)','Água (L)','Gasto (kcal)','Balanço (kcal)'])];
    days.filter(k => (S.food[k] || []).length || S.water[k]).forEach(k => { const t = foodTotals(k), e = energy(k);
      nu.push([DT(k), IN(t.kcal), D1(t.p), D1(t.c), D1(t.f), D1((S.water[k]||0)/1000), IN(e.out), t.kcal ? IN(t.kcal - e.out) : '']); });
    const pe = [H(['Data','Peso (kg)'])]; [...S.weights].sort((a,b) => a.d < b.d ? -1 : 1).forEach(w => pe.push([DT(w.d), D1(w.kg)]));
    const md = [H(['Data', ...MEAS_ALL.map(m => m[1])])]; measList().forEach(x => md.push([DT(x.d), ...MEAS_ALL.map(([k]) => num(x.m[k]) ? D1(num(x.m[k])) : '')]));
    const res = [[['Meu Treino'+(displayName() ? ' — '+displayName() : ''),'t']], [['Semana de segunda a domingo','n']], [], [['RESUMO','s']], H(['Indicador','Valor']),
      ['Peso atual (kg)', D1(curWeight())], ['Sessões cadastradas', IN(S.plans.length)], ['Exercícios com carga registrada', IN(Object.keys(hist).length)],
      ['Meta de proteína (g/dia)', IN(proteinTarget())], ['Meta de água (L/dia)', D1(waterGoal()/1000)]];
    return [
      { name:'Resumo', rows:res, widths:[34,16] }, { name:'Treinos', rows:tr, widths:[12,11,34,10,10,12,8,8,8,12,40], freeze:1, filter:1 },
      { name:'Evolução de cargas', rows:ev, widths:[32,9,12,12,10,12,70], freeze:1, filter:1 }, { name:'Séries', rows:se, widths:[12,32,7,12,11,8], freeze:1, filter:1 },
      { name:'Corridas e cardio', rows:ca, widths:[12,10,26,8,12], freeze:1 }, { name:'Nutrição', rows:nu, widths:[12,15,12,10,12,10,12,14], freeze:1 },
      { name:'Peso', rows:pe, widths:[12,11], freeze:1 }, { name:'Medidas', rows:md, widths:[12, ...MEAS_ALL.map(() => 12)], freeze:1 }];
  } catch(e){ return null; }
}

const API_URL = 'https://script.google.com/macros/s/AKfycbyo0VMkQCkkKyp94dO8CkvIepAGG5C1QKqn6r9jNuDFMLLAss7Aje78MnRq4vuwSSDI/exec';

function api(action, data){
  const payload = Object.assign({ action }, data || {});
  const fail = r => { const e = new Error((r && r.error) || 'Erro no servidor.'); e.code = r && r.code; return e; };
  if (HAS_GAS) return new Promise((res, rej) => google.script.run
    .withSuccessHandler(r => r && r.ok ? res(r) : rej(fail(r)))
    .withFailureHandler(() => rej(fail({ error:'Sem conexão com o servidor. Verifique a internet.' })))
    .api(payload));
  return fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(payload) })
    .then(r => r.json()).catch(() => { throw fail({ error:'Sem conexão com o servidor. Verifique a internet e se a implantação está com acesso “Qualquer pessoa”.' }); })
    .then(r => { if (!r.ok) throw fail(r); return r; });
}

function schedulePush(){
  if (!ACC || ACC.mode !== 'cloud' || !SYNC.ready) return;
  SYNC.st = 'pending'; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(push, 3000);

async function push(){
  clearTimeout(SYNC.timer);
  if (!ACC || ACC.mode !== 'cloud' || !SYNC.ready) return;
  SYNC.st = 'saving';
  try {
    if (!S.updated) S.updated = Date.now();
    const r = await api('push', { token:ACC.token, state:JSON.stringify(S), tables:JSON.stringify(sheetTables()), updated:S.updated });
    if (r.user){ ACC.user = r.user; storeSession(); }
    SYNC.st = 'ok'; SYNC.at = Date.now();
  } catch(e){ if (handleAuthError(e)) return; SYNC.st = 'error'; SYNC.err = e.message; }
  if (UI.tab === 'plan') refreshSyncLine();
}
async function pull(){
  if (!ACC || ACC.mode !== 'cloud' || SYNC.pulling || SYNC.st === 'pending' || SYNC.st === 'saving') return;
  SYNC.pulling = true; SYNC.lastPull = Date.now();
  let changed = false;
  try {
    const r = await api('pull', { token:ACC.token });
    if (r.user){ ACC.user = r.user; storeSession(); }
    const remote = r.state ? JSON.parse(r.state) : null;
    SYNC.ready = true;
    if (remote && (remote.updated || 0) > (S.updated || 0)){ S = normalize(remote); saveLocal(); changed = true; SYNC.st = 'ok'; SYNC.at = Date.now(); }
    if (ensureOwnerFicha()){ changed = true; S.updated = Date.now(); saveLocal(); SYNC.pulling = false; await push(); }
    else if (!remote || (S.updated || 0) > (remote.updated || 0)){ if (S.updated){ SYNC.pulling = false; await push(); } else SYNC.st = 'ok'; }
    else { SYNC.st = 'ok'; SYNC.at = Date.now(); }
    changed = true;
  } catch(e){ if (handleAuthError(e)){ SYNC.pulling = false; return; } SYNC.st = 'error'; SYNC.err = e.message; SYNC.ready = true; changed = true; }
  SYNC.pulling = false;
  if (changed) render(true);
}

  case 'weekDel': applyWeek(Object.assign({}, S.wd, { [t.dataset.d]: (S.wd[t.dataset.d] || []).filter(x => x !== t.dataset.p) })); break;
  case 'editPlan': UI.editPlan = UI.editPlan === id ? null : id; UI.libq = ''; render(true); return;
  case 'libF': UI.lib = t.dataset.f; render(true); return;
  case 'libAdd': { const x = LIB.find(l => l.n === t.dataset.n); if (!x) return;
    const isGym = plan.type === 'gym';
    plan.ex.push({ id:uid(), name:x.n, sets: isGym ? 3 : (x.t === 'release' ? 1 : 2), reps: isGym ? '8–12' : (x.t === 'gym' ? '10–12' : '30 s'), group:'', mk:x.m.slice() }); break; }
  case 'exAdd': plan.ex.push({ id:uid(), name:'', sets: plan.type === 'gym' ? 3 : 2, reps: plan.type === 'gym' ? '8–12' : '', group:'', mk:[] }); break;
  case 'exDel': if (!confirm('Excluir "'+(plan.ex[i].name || 'item')+'"?')) return; plan.ex.splice(i,1); break;
  case 'exUp': if (i > 0) [plan.ex[i-1], plan.ex[i]] = [plan.ex[i], plan.ex[i-1]]; break;
  case 'exDown': if (i < plan.ex.length-1) [plan.ex[i+1], plan.ex[i]] = [plan.ex[i], plan.ex[i+1]]; break;
  case 'newPlan': { const ty = t.dataset.t;
    const p = { id:'p'+uid(), type:ty, name: ty === 'run' ? 'Corrida 5 km' : ty === 'simple' ? 'Pilates' : 'Novo treino de '+TYPES[ty].n.toLowerCase(), focus:'', tag: ty === 'run' ? '5 km' : 'Novo',
      color:{ gym:'#3b8cf0', run:'#12a37a', mob:'#8068f0', simple:'#8a97aa' }[ty], note:'', rest: ty === 'gym' ? '60–90 s' : '', intensity: ty === 'gym' ? '1–2 repetições sobrando' : '',
      min: ty === 'mob' ? 20 : ty === 'run' ? 30 : 60, km: ty === 'run' ? 5 : '', ex: ty === 'simple' ? [{ id:'e0', name:'Aula de pilates', sets:0, reps:'1 aula', group:'', mk:['abdomen','lombar'] }] : [] };
    S.plans.push(p); UI.editPlan = p.id; break; }
  case 'dupPlan': { const p = JSON.parse(JSON.stringify(plan)); p.id = 'p'+uid(); p.name += ' (cópia)'; S.plans.push(p); UI.editPlan = p.id; break; }
  case 'delPlan': { if (!confirm('Excluir "'+plan.name+'"? Ela sai da semana e dos dias futuros; os registros feitos continuam salvos.')) return;
    const wd = {}; for (const d in S.wd) wd[d] = (S.wd[d] || []).filter(x => x !== plan.id); applyWeek(wd);
    for (const kk in S.schedule) if (kk >= TODAY) S.schedule[kk] = S.schedule[kk].filter(x => x !== plan.id);
    if (!Object.keys(S.schedule).some(kk => S.schedule[kk].includes(plan.id))) S.plans = S.plans.filter(p => p !== plan); else plan.archived = true;
    break; }
  case 'tplWeek': { const tp = TPL_WEEK.find(x => x.k === t.dataset.k);
    if (!confirm('Usar o modelo "'+tp.name+'" a partir de hoje? Sua semana atual será substituída (registros já feitos continuam salvos).')) return;
    useWeekTemplate(tp); if (tp.k === 'max') S.fv = FICHA_VER; UI.tab = 'train'; UI.sel = TODAY; save(); render(); window.scrollTo(0,0); return; }
  case 'tplSess': { const tp = TPL_SESS.find(x => x.k === t.dataset.k), p = clonePlan(tp, 'p'+uid()); p.tag = p.name.split(' ')[0].slice(0,9); S.plans.push(p); UI.editPlan = p.id;
    save(); render(true); alert('"'+p.name+'" adicionada às suas sessões. Agora escolha os dias em Semana.'); return; }
  case 'reset': if (!confirm('Apagar TODOS os seus registros e treinos'+(ACC.mode === 'cloud' ? ' (inclusive no Drive)' : '')+'? Isso não pode ser desfeito.')) return;
    { const nm = S.appName, fv = S.fv; S = defaultState(); S.appName = nm; S.fv = fv; } break;
  default: return;
  }
  save(); render(true);
});
document.addEventListener('input', ev => {
  if (!ACC) return;
  const t = ev.target, ds = t.dataset || {};
  if (ds.f){ const it = findItem(ds.id); if (!it) return; const e = entry(UI.sel, it);
    if (ds.f === 'r' || ds.f === 'k') e.sets[+ds.i][ds.f] = t.value; else e[ds.f] = t.value;
    if (it.kind === 'cardio'){ e.done = !!num(e.km);
      const pe = document.getElementById('pace'+UI.sel+it.id), pace = num(e.km) && num(e.min) ? num(e.min)/num(e.km) : 0;
      if (pe) pe.textContent = pace ? 'Pace '+Math.floor(pace)+':'+pad(Math.round((pace%1)*60))+' min/km · '+fmt(60/pace,1)+' km/h' : 'Preencha distância e tempo para ver o pace'; }
    save(); return; }
  if (ds.day){ (S.day[UI.sel] || (S.day[UI.sel] = {}))[ds.day] = t.value; save(); return; }
  if (ds.food === 'q'){ UI.q = t.value; UI.pick = null; document.getElementById('fpick').innerHTML = ''; document.getElementById('fres').innerHTML = foodResults(); return; }
  if (ds.food === 'g'){ UI.g = t.value; const pv = document.getElementById('pv'); if (pv) pv.textContent = preview(UI.pick, num(t.value)); return; }
  if (ds.lib === 'q'){ UI.libq = t.value; const pid = UI.editPlan, box = document.createElement('div'); box.innerHTML = libraryBlock(pid);
    const r = box.querySelector('#libres'), cur = document.getElementById('libres'); if (r && cur) cur.innerHTML = r.innerHTML; return; }
  if (ds.pf){ const p = planById(ds.pid); p[ds.pf] = ds.pf === 'min' || ds.pf === 'km' ? t.value.replace(',','.') : t.value; save(); return; }
  if (ds.ef){ const e = planById(ds.pid).ex.find(x => x.id === ds.eid);
    e[ds.ef] = ds.ef === 'sets' ? (parseInt(t.value) || 0) : t.value; if (ds.ef === 'name') e.mk = musclesOf(t.value); save(); return; }
});
document.addEventListener('change', ev => {
  if (!ACC) return;
  const t = ev.target, ds = t.dataset || {};
  if (ds.ch === 'dayAdd'){ if (!t.value) return; materialize(UI.sel); S.schedule[UI.sel].push(t.value); UI.sess = t.value; }
  else if (ds.ch === 'weekAdd'){ if (!t.value) return; applyWeek(Object.assign({}, S.wd, { [ds.d]: [...(S.wd[ds.d] || []), t.value] })); }
  else if (ds.ch === 'profile'){ S.profile[ds.k] = ['sex','goal'].includes(ds.k) ? t.value : (num(t.value) || t.value);
    if (ds.k === 'goal' && t.value === 'recomp' && num(S.profile.protein) < 2) S.profile.protein = 2.0; }
  else if (ds.ch === 'meal'){ UI.meal = +t.value; return; }
  else if (ds.ch === 'pcolor') planById(ds.pid).color = t.value;
  else if (ds.ch === 'ptype'){ const p = planById(ds.pid); p.type = t.value; if (p.type === 'run' && !p.km) p.km = 5; }
  else return;
  save(); render(true);
});
boot();
</script>
